name: Generate worlds

# Runs worlds/generate-worlds.mjs against the World Labs API and commits
# worlds/worlds/ back to the branch it ran on. The commit also happens when the
# run fails, so state.json lets the next run resume operations in progress
# instead of paying for them again. Each commit redeploys on Vercel.
#
# Two ways to start it: "Run workflow" on the Actions tab, or a push to main
# that changes worlds/run.json, whose quality, only, force, refresh and credits fields
# stand in for the inputs below. refresh re-reads finished worlds for free; credits
# only reads the API credit balance into worlds/worlds/credits.json (free). The workflow's own commits never touch run.json.
#
# Needs the repository secret WORLDLABS_API_KEY (Settings > Secrets and
# variables > Actions). Never put the key in code or logs.

on:
  push:
    branches: [main]
    paths: [worlds/run.json]
  workflow_dispatch:
    inputs:
      quality:
        description: "draft (marble-1.0-draft, about $0.18 a world) or full (marble-1.1, about $1.26 a world)"
        type: choice
        options: [draft, full]
        default: draft
      only:
        description: "Comma separated element ids (blank for all), e.g. bob-cockpit,singularity-core"
        type: string
        required: false
        default: ""
      force:
        description: "Regenerate worlds that are already finished"
        type: boolean
        default: false
      refresh:
        description: "Only re-read finished worlds and fetch missing panoramas (free, no generation)"
        type: boolean
        default: false
      credits:
        description: "Only read the API credit balance (free, no generation)"
        type: boolean
        default: false
      comic:
        description: "Comic id (obtran003 uses worlds/, others comics/<id>/worlds/)"
        type: string
        default: obtran003

permissions:
  contents: write

concurrency:
  group: generate-worlds-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Read the run settings
        id: settings
        env:
          EVENT: ${{ github.event_name }}
          IN_QUALITY: ${{ inputs.quality }}
          IN_ONLY: ${{ inputs.only }}
          IN_FORCE: ${{ inputs.force }}
          IN_REFRESH: ${{ inputs.refresh }}
          IN_CREDITS: ${{ inputs.credits }}
          IN_COMIC: ${{ inputs.comic }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            q="$IN_QUALITY"; o="$IN_ONLY"; f="$IN_FORCE"; r="$IN_REFRESH"; c="$IN_CREDITS"; k="$IN_COMIC"
          else
            q=$(node -p "require('./worlds/run.json').quality || 'draft'")
            o=$(node -p "[].concat(require('./worlds/run.json').only || []).join(',')")
            f=$(node -p "String(require('./worlds/run.json').force === true)")
            r=$(node -p "String(require('./worlds/run.json').refresh === true)")
            c=$(node -p "String(require('./worlds/run.json').credits === true)")
            k=$(node -p "require('./worlds/run.json').comic || 'obtran003'")
          fi
          k="${k:-obtran003}"
          case "$k" in *[!a-z0-9-]*) echo "::error::comic must be a comic id"; exit 1 ;; esac
          if [ "$k" = "obtran003" ]; then out=worlds/worlds; else out="comics/$k/worlds/worlds"; fi
          case "$q" in draft|full) ;; *) echo "::error::quality must be draft or full, got '$q'"; exit 1 ;; esac
          case "$o" in *[!a-z0-9,-]*) echo "::error::only may hold element ids and commas only"; exit 1 ;; esac
          echo "quality=$q" >> "$GITHUB_OUTPUT"
          echo "only=$o" >> "$GITHUB_OUTPUT"
          echo "force=$f" >> "$GITHUB_OUTPUT"
          echo "refresh=$r" >> "$GITHUB_OUTPUT"
          echo "credits=$c" >> "$GITHUB_OUTPUT"
          echo "comic=$k" >> "$GITHUB_OUTPUT"
          echo "out=$out" >> "$GITHUB_OUTPUT"
          echo "comic=$k quality=$q only=${o:-all} force=$f refresh=$r credits=$c"

      - name: Check the API key is set
        env:
          WORLDLABS_API_KEY: ${{ secrets.WORLDLABS_API_KEY }}
        run: |
          if [ -z "$WORLDLABS_API_KEY" ]; then
            echo "::error::Add the WORLDLABS_API_KEY secret under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Read the credit balance only
        if: steps.settings.outputs.credits == 'true'
        working-directory: worlds
        env:
          WORLDLABS_API_KEY: ${{ secrets.WORLDLABS_API_KEY }}
          COMIC: ${{ steps.settings.outputs.comic }}
        run: node generate-worlds.mjs --credits

      - name: Plan
        if: steps.settings.outputs.credits != 'true'
        working-directory: worlds
        env:
          QUALITY: ${{ steps.settings.outputs.quality }}
          ONLY: ${{ steps.settings.outputs.only }}
          FORCE: ${{ steps.settings.outputs.force }}
          REFRESH: ${{ steps.settings.outputs.refresh }}
          COMIC: ${{ steps.settings.outputs.comic }}
        run: |
          args=()
          [ "$QUALITY" = "draft" ] && args+=(--draft)
          [ -n "$ONLY" ] && args+=(--only "$ONLY")
          [ "$FORCE" = "true" ] && args+=(--force)
          [ "$REFRESH" = "true" ] && args+=(--refresh)
          node generate-worlds.mjs --dry-run "${args[@]}"

      - name: Generate
        if: steps.settings.outputs.credits != 'true'
        working-directory: worlds
        env:
          WORLDLABS_API_KEY: ${{ secrets.WORLDLABS_API_KEY }}
          QUALITY: ${{ steps.settings.outputs.quality }}
          ONLY: ${{ steps.settings.outputs.only }}
          FORCE: ${{ steps.settings.outputs.force }}
          REFRESH: ${{ steps.settings.outputs.refresh }}
          COMIC: ${{ steps.settings.outputs.comic }}
        run: |
          args=()
          [ "$QUALITY" = "draft" ] && args+=(--draft)
          [ -n "$ONLY" ] && args+=(--only "$ONLY")
          [ "$FORCE" = "true" ] && args+=(--force)
          [ "$REFRESH" = "true" ] && args+=(--refresh)
          node generate-worlds.mjs "${args[@]}"

      - uses: actions/setup-python@v5
        if: always() && steps.settings.outputs.credits != 'true' && steps.settings.outputs.comic == 'obtran003'
        with:
          python-version: "3.12"

      # OBTRAN 003's black and white grade; colour comics get their own grade (to come).
      - name: Clean the worlds and measure their grade and look limits
        if: always() && steps.settings.outputs.credits != 'true' && steps.settings.outputs.comic == 'obtran003'
        run: |
          if ls worlds/worlds/*.spz >/dev/null 2>&1; then
            pip install --quiet numpy pillow
            python tools/clean_worlds.py
          else
            echo "No worlds to clean."
          fi

      - name: Report sizes
        if: always()
        env:
          OUT: ${{ steps.settings.outputs.out }}
        run: ls -la "$OUT" || true

      - name: Commit results
        if: always()
        env:
          QUALITY: ${{ steps.settings.outputs.quality }}
          OUTCOME: ${{ job.status }}
          OUT: ${{ steps.settings.outputs.out }}
          COMIC: ${{ steps.settings.outputs.comic }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -z "$OUT" ] || [ ! -d "$OUT" ]; then
            echo "No results to commit."
            exit 0
          fi
          git add "$OUT"
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Generate worlds ($COMIC, $QUALITY, $OUTCOME)"
          for i in 1 2 3 4; do
            git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep $((i * 5))
          done
          exit 1
