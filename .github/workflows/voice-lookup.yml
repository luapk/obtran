name: Voice lookup

# Searches the ElevenLabs voice library (and the account's own voices) for the names in
# voices/lookup.json and commits what it finds to voices/lookup-results.json: each voice's
# id, name, category, description, accent, and preview URL. Free: no audio is rendered.
# Starts from a push to main that changes voices/lookup.json.
# Needs ELEVENLABS_API_KEY (the key may need the voices read permission).

on:
  push:
    branches: [main]
    paths: [voices/lookup.json]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lookup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Search
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          node - <<'JS'
          const fs = require('fs');
          const { names } = JSON.parse(fs.readFileSync('voices/lookup.json', 'utf8'));
          const H = { 'xi-api-key': process.env.ELEVENLABS_API_KEY };
          const out = { checked: new Date().toISOString(), results: {} };
          const pick = (v) => ({ voice_id: v.voice_id, name: v.name, category: v.category, description: v.description,
            accent: v.accent || v.labels?.accent, gender: v.gender || v.labels?.gender, age: v.age || v.labels?.age,
            use_case: v.use_case || v.labels?.use_case, public_owner_id: v.public_owner_id, preview_url: v.preview_url });
          for (const name of names) {
            const r = out.results[name] = {};
            for (const [key, url] of [
              ['library', `https://api.elevenlabs.io/v1/shared-voices?page_size=20&search=${encodeURIComponent(name)}`],
              ['account', `https://api.elevenlabs.io/v2/voices?page_size=50&search=${encodeURIComponent(name)}`],
            ]) {
              const res = await fetch(url, { headers: H });
              const text = await res.text();
              if (!res.ok) { r[key] = { error: `HTTP ${res.status} ${text.slice(0, 200)}` }; continue; }
              const j = JSON.parse(text);
              r[key] = (j.voices || []).map(pick);
            }
            console.log(name, JSON.stringify(r).slice(0, 600));
          }
          fs.writeFileSync('voices/lookup-results.json', JSON.stringify(out, null, 2) + '\n');
          JS
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add voices/lookup-results.json
          git diff --cached --quiet && exit 0
          git commit -m "Voice lookup results"
          for i in 1 2 3 4; do git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && exit 0; sleep $((i * 5)); done
          exit 1
