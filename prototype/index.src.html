<!doctype html>
<html lang="en-GB">
<head>

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23060504'/%3E%3Ccircle cx='16' cy='16' r='10' fill='none' stroke='%238a6a4a' stroke-width='1.5'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23efe9df'/%3E%3C/svg%3E">
<meta name="description" content="OBTRAN 003 comic page from Oblivious Transfer, read as an interactive 3D page.">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #060504;
    --paper: #efe9df;
    --sepia: #8a6a4a;
    --dim: rgba(239, 233, 223, 0.62);
    --bg: #060504;
  }
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--paper); overflow: hidden; }
  body { font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace; -webkit-tap-highlight-color: transparent; touch-action: none; user-select: none; -webkit-user-select: none; }
  canvas { display: block; position: fixed; inset: 0; width: 100%; height: 100%; }
  .vignette { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,0.55) 100%); }
  .grain { position: fixed; inset: -50%; pointer-events: none; opacity: 0.09; mix-blend-mode: screen; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); animation: grain 0.6s steps(4) infinite; }
  @keyframes grain { 0%{transform:translate(0,0)} 25%{transform:translate(-3%,2%)} 50%{transform:translate(2%,-3%)} 75%{transform:translate(-2%,-1%)} 100%{transform:translate(0,0)} }
  .flash { position: fixed; inset: 0; pointer-events: none; background: var(--paper); opacity: 0; mix-blend-mode: overlay; }
  .black { position: fixed; inset: 0; pointer-events: none; background: #000; opacity: 0; transition: opacity 0.5s; }

  #gate { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(6,5,4,0.72); z-index: 5; transition: opacity 0.6s; padding: 16px; }
  #gate.hide { opacity: 0; pointer-events: none; }
  .gate-card { text-align: center; max-width: 22rem; }
  .gate-card h1 { font-size: 0.95rem; letter-spacing: 0.32em; font-weight: 600; margin: 0 0 0.4rem; }
  .gate-card .cat { font-size: 0.72rem; letter-spacing: 0.24em; color: var(--dim); margin: 0 0 2rem; }
  .gate-card button { font: inherit; font-size: 0.85rem; letter-spacing: 0.2em; color: var(--ink); background: var(--paper); border: 0; padding: 0.95rem 2.2rem; cursor: pointer; clip-path: polygon(4% 0, 100% 0, 96% 100%, 0 100%); }
  .gate-card button:focus-visible { outline: 2px solid var(--sepia); outline-offset: 4px; }
  .gate-card .note { margin-top: 1.4rem; font-size: 0.7rem; line-height: 1.6; color: var(--dim); }
  .gate-card .err { color: #d9a27a; }

  #hint { position: fixed; left: 50%; bottom: max(22px, env(safe-area-inset-bottom)); transform: translateX(-50%); font-size: 0.7rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--dim); background: rgba(6,5,4,0.7); padding: 0.55rem 0.9rem; z-index: 3; transition: opacity 0.4s; white-space: nowrap; pointer-events: none; }
  #hint.off { opacity: 0; }
  #hint.nudge { animation: nudge 0.4s; }
  @keyframes nudge { 0%,100%{transform:translateX(-50%)} 25%{transform:translateX(calc(-50% - 6px))} 75%{transform:translateX(calc(-50% + 6px))} }

  .ui-btn { position: fixed; z-index: 4; font: inherit; font-size: 0.66rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--paper); background: rgba(6,5,4,0.7); border: 1px solid rgba(239,233,223,0.25); padding: 0.5rem 0.7rem; cursor: pointer; }
  #mute { top: max(14px, env(safe-area-inset-top)); right: 14px; }
  #again { left: 50%; bottom: max(70px, calc(env(safe-area-inset-bottom) + 56px)); transform: translateX(-50%); opacity: 0; pointer-events: none; transition: opacity 0.8s; }
  #again.show { opacity: 1; pointer-events: auto; }

  #review { position: fixed; left: 14px; top: max(14px, env(safe-area-inset-top)); z-index: 4; display: flex; flex-wrap: wrap; gap: 6px; max-width: calc(100% - 120px); }
  #review .ui-btn { position: static; }
  #review .ui-btn[aria-pressed="true"] { background: var(--paper); color: var(--ink); }
  @media (max-width: 600px) { #review { gap: 4px; } #review .ui-btn { font-size: 0.56rem; letter-spacing: 0.1em; padding: 0.35rem 0.45rem; } }
  #ring { position: fixed; width: 96px; height: 96px; margin: -48px 0 0 -48px; pointer-events: none; z-index: 4; opacity: 0; transition: opacity 0.2s; }
  #ring.on { opacity: 1; }
  #ring circle { fill: none; stroke-width: 3; }
  #ring .track { stroke: rgba(239,233,223,0.2); }
  #ring .prog { stroke: var(--paper); stroke-linecap: square; transform: rotate(-90deg); transform-origin: 50% 50%; }

  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>

<div class="vignette"></div>

<script type="importmap">{ "imports": { "three": "%%THREE_URL%%", "three/addons/": "%%THREE_ADDONS_URL%%", "@sparkjsdev/spark": "%%SPARK_URL%%" } }</script>
<script type="module">
import * as THREE from 'three';

const PAGE_SRC = '%%PAGE_SRC%%';
const DEPTH_SRC = '%%DEPTH_SRC%%';
const META = %%META%%;

/* ---------- constants ---------- */
const PW = 2.0;
const PH = PW * META.aspect;
const DEPTH_SCALE = 0.9;
const CX = (META.centre[0] - 0.5) * PW;
const CY = (0.5 - META.centre[1]) * PH;
const VOID_Z = -26;
const BREACH_DUR = 4.8;
const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const isTouch = matchMedia('(pointer: coarse)').matches;

const BEATS = [
  { b: 'caption' },
  { b: 'crsh', fx: 'static' },
  { b: 'smoke1', fx: 'blip' },
  { b: 'engage', fx: 'blip' },
  { b: 'bob1' },
  { b: 'drill', fx: 'blip' },
  { b: 'unlock', fx: 'blip', hold: true },
  { b: 'holy' },
  { b: 'qntm', trigger: true },
];

const $ = (id) => document.getElementById(id);
const hintEl = $('hint');
const tapWord = isTouch ? 'Tap' : 'Click';

function uvToWorld(u, v) { return new THREE.Vector2((u - 0.5) * PW, (0.5 - v) * PH); }
function clamp(x, a, b) { return Math.min(b, Math.max(a, x)); }
function lerp(a, b, t) { return a + (b - a) * t; }
function ease(t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }
function smooth(e0, e1, x) { const t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); }

/* ---------- renderer ---------- */
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
  if (!renderer.capabilities.isWebGL2) throw new Error('WebGL2 not available');
} catch (e) {
  $('note').innerHTML = '<span class="err">This browser cannot run the 3D page (WebGL2 is unavailable).</span>';
  $('start').disabled = true;
  throw e;
}
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x060504, 1);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x060504);
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.01, 800);
camera.rotation.order = 'YXZ';
scene.add(camera);

/* ---------- textures ---------- */
const loader = new THREE.TextureLoader();
function loadTex(src, srgb) {
  return new Promise((res, rej) => loader.load(src, (t) => {
    t.flipY = false;
    t.colorSpace = srgb ? THREE.SRGBColorSpace : THREE.NoColorSpace;
    t.minFilter = THREE.LinearMipmapLinearFilter;
    t.magFilter = THREE.LinearFilter;
    t.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
    t.generateMipmaps = true;
    res(t);
  }, undefined, rej));
}

const shared = {
  uPage: { value: null },
  uDepth: { value: null },
  uDepthScale: { value: DEPTH_SCALE },
  uTime: { value: 0 },
  uAgit: { value: 0 },
  uFlash: { value: 0 },
  uCentre: { value: new THREE.Vector2(META.centre[0], META.centre[1]) },
  uAspect: { value: META.aspect },
  uPageSize: { value: new THREE.Vector2(PW, PH) },
};

const GLSL_COMMON = `
  uniform sampler2D uPage;
  uniform sampler2D uDepth;
  uniform float uDepthScale;
  uniform float uTime;
  uniform float uAgit;
  uniform vec2 uCentre;
  uniform float uAspect;
  uniform vec2 uPageSize;
  float depthAt(vec2 puv) { return (texture2D(uDepth, puv).r * 2.0 - 1.0) * uDepthScale; }
  float coreR(vec2 puv) { vec2 d = puv - uCentre; d.y *= uAspect; return length(d); }
  vec3 pagePos(vec2 puv) {
    float z = depthAt(puv);
    float r = coreR(puv);
    float k = exp(-pow(r / 0.16, 2.0));
    z += uAgit * k * 0.035 * sin(uTime * 37.0 + puv.x * 80.0 + puv.y * 63.0);
    z -= uAgit * k * 0.12;
    return vec3((puv.x - 0.5) * uPageSize.x, (0.5 - puv.y) * uPageSize.y, z);
  }
  float hash(float n) { return fract(sin(n) * 43758.5453123); }
`;

/* ---------- page mesh (2.5D relief) ---------- */
const bubbleRects = META.bubbles.map((b) => new THREE.Vector4(...b.uv));
const lifts = new Array(10).fill(0);
const pageMat = new THREE.ShaderMaterial({
  uniforms: {
    ...shared,
    uRects: { value: bubbleRects },
    uLifts: { value: lifts },
    uOpacity: { value: 1 },
  },
  transparent: true,
  vertexShader: GLSL_COMMON + `
    varying vec2 vPuv;
    void main() {
      vPuv = vec2(uv.x, 1.0 - uv.y);
      vec3 p = pagePos(vPuv);
      gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
    }`,
  fragmentShader: GLSL_COMMON + `
    uniform vec4 uRects[10];
    uniform float uLifts[10];
    uniform float uOpacity;
    uniform float uFlash;
    varying vec2 vPuv;
    void main() {
      vec3 col = texture2D(uPage, vPuv).rgb;
      for (int i = 0; i < 10; i++) {
        vec4 r = uRects[i];
        vec2 m = smoothstep(r.xy - 0.004, r.xy + 0.004, vPuv) * (1.0 - smoothstep(r.zw - 0.004, r.zw + 0.004, vPuv));
        col *= 1.0 - 0.96 * uLifts[i] * m.x * m.y;
      }
      float r = coreR(vPuv);
      float pulse = 0.5 + 0.5 * sin(uTime * (1.6 + uAgit * 6.0));
      col += vec3(1.0, 0.96, 0.9) * exp(-pow(r / 0.07, 2.0)) * (0.10 + 0.12 * pulse) * (1.0 + 2.5 * uAgit);
      col += vec3(0.55, 0.42, 0.3) * exp(-pow(r / 0.2, 2.0)) * 0.12 * uAgit * pulse;
      col *= 1.0 + uFlash * 0.6 * (0.5 + 0.5 * sin(vPuv.y * 900.0 + uTime * 60.0));
      gl_FragColor = vec4(col, uOpacity);
      #include <colorspace_fragment>
    }`,
});
const pageMesh = new THREE.Mesh(new THREE.PlaneGeometry(PW, PH, 320, Math.round(320 * META.aspect)), pageMat);
scene.add(pageMesh);

/* ---------- lifted bubbles ---------- */
const bubbleZ = 0.24 * DEPTH_SCALE + 0.006;
const bubbles = META.bubbles.map((b, i) => {
  const [u0, v0, u1, v1] = b.uv;
  const mat = new THREE.ShaderMaterial({
    uniforms: { uPage: shared.uPage, uRect: { value: new THREE.Vector4(u0, v0, u1, v1) }, uFlick: { value: 0 }, uTime: shared.uTime, uOpacity: { value: 1 }, uGlow: { value: 0 } },
    transparent: true,
    depthWrite: false,
    vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
    fragmentShader: `
      uniform sampler2D uPage; uniform vec4 uRect; uniform float uFlick; uniform float uTime; uniform float uOpacity; uniform float uGlow;
      varying vec2 vUv;
      void main(){
        vec2 p = mix(uRect.xy, uRect.zw, vec2(vUv.x, 1.0 - vUv.y));
        vec3 col = texture2D(uPage, p).rgb;
        float scan = 0.82 + 0.18 * sin(gl_FragCoord.y * 1.7 + uTime * 30.0);
        float jitter = 0.75 + 0.5 * fract(sin(floor(uTime * 24.0) * 12.9898) * 43758.5453);
        col *= mix(1.0, scan * jitter, uFlick);
        col += vec3(0.25, 0.22, 0.18) * uGlow;
        float edge = smoothstep(0.0, 0.015, vUv.x) * smoothstep(0.0, 0.015, 1.0 - vUv.x) * smoothstep(0.0, 0.03, vUv.y) * smoothstep(0.0, 0.03, 1.0 - vUv.y);
        gl_FragColor = vec4(col, uOpacity * edge);
        #include <colorspace_fragment>
      }`,
  });
  const w = (u1 - u0) * PW, h = (v1 - v0) * PH;
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat);
  const c = uvToWorld((u0 + u1) / 2, (v0 + v1) / 2);
  mesh.position.set(c.x, c.y, bubbleZ);
  mesh.visible = false;
  mesh.renderOrder = 2;
  scene.add(mesh);
  const hit = new THREE.Mesh(new THREE.PlaneGeometry(w * 1.5, h * 2.2), new THREE.MeshBasicMaterial({ visible: false }));
  mesh.add(hit);
  return { ...b, i, mesh, mat, hit, base: c, lift: 0, target: 0, flickT: 0 };
});
const bubbleById = Object.fromEntries(bubbles.map((b) => [b.id, b]));

/* ---------- vortex inflow particles ---------- */
const INFLOW = 1400;
const inflowGeo = new THREE.BufferGeometry();
{
  const seed = new Float32Array(INFLOW * 3);
  for (let i = 0; i < INFLOW; i++) { seed[i * 3] = Math.random(); seed[i * 3 + 1] = Math.random(); seed[i * 3 + 2] = Math.random(); }
  inflowGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(INFLOW * 3), 3));
  inflowGeo.setAttribute('seed', new THREE.BufferAttribute(seed, 3));
}
const inflowMat = new THREE.ShaderMaterial({
  uniforms: { ...shared, uScale: { value: 1 } },
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: GLSL_COMMON + `
    attribute vec3 seed; uniform float uScale; varying float vA;
    void main(){
      float ph = fract(seed.x + uTime * (0.10 + seed.y * 0.22) * (0.4 + uAgit));
      float rad = mix(0.55, 0.012, ph * ph);
      float ang = seed.z * 6.2831 + ph * (3.0 + seed.y * 4.0);
      vec2 puv = uCentre + vec2(cos(ang), sin(ang) / uAspect) * rad;
      vec3 p = pagePos(clamp(puv, 0.0, 1.0));
      p.z += 0.02;
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      gl_Position = projectionMatrix * mv;
      gl_PointSize = (1.5 + seed.y * 2.5) * uScale * 0.004 / -mv.z;
      vA = uAgit * smoothstep(0.0, 0.15, ph) * (1.0 - smoothstep(0.85, 1.0, ph));
    }`,
  fragmentShader: `varying float vA; void main(){ vec2 c = gl_PointCoord - 0.5; float a = exp(-dot(c,c) * 14.0); gl_FragColor = vec4(vec3(0.94,0.91,0.86) * a * vA, 1.0); }`,
});
const inflow = new THREE.Points(inflowGeo, inflowMat);
inflow.frustumCulled = false;
scene.add(inflow);

/* ---------- page as particles (used for the breach) ---------- */
const NX = 380, NY = Math.round(380 * META.aspect);
const ptsGeo = new THREE.BufferGeometry();
{
  const puv = new Float32Array(NX * NY * 2), rnd = new Float32Array(NX * NY);
  let k = 0;
  for (let y = 0; y < NY; y++) for (let x = 0; x < NX; x++) {
    puv[k * 2] = (x + 0.5) / NX; puv[k * 2 + 1] = (y + 0.5) / NY; rnd[k] = Math.random(); k++;
  }
  ptsGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(NX * NY * 3), 3));
  ptsGeo.setAttribute('puv', new THREE.BufferAttribute(puv, 2));
  ptsGeo.setAttribute('rnd', new THREE.BufferAttribute(rnd, 1));
}
const ptsMat = new THREE.ShaderMaterial({
  uniforms: { ...shared, uT: { value: 0 }, uScale: { value: 1 }, uSpacing: { value: PW / NX }, uCentreW: { value: new THREE.Vector2(CX, CY) } },
  transparent: true, depthWrite: false,
  vertexShader: GLSL_COMMON + `
    attribute vec2 puv; attribute float rnd;
    uniform float uT; uniform float uScale; uniform float uSpacing; uniform vec2 uCentreW;
    varying vec3 vCol; varying float vA;
    void main(){
      vec3 p = pagePos(puv);
      vCol = texture2D(uPage, puv).rgb;
      vec2 d = p.xy - uCentreW;
      float r = length(d) / 2.2;
      float tr = r * 0.42 + rnd * 0.12;
      float l = clamp((uT - tr) / 0.42, 0.0, 1.0);
      float e = l * l;
      float ang = e * (0.8 + rnd * 1.6) * (rnd > 0.5 ? 1.0 : -1.0);
      float cs = cos(ang), sn = sin(ang);
      d = vec2(d.x * cs - d.y * sn, d.x * sn + d.y * cs);
      p.xy = uCentreW + d * (1.0 + e * (1.2 + rnd * 3.5));
      p.z += e * (0.6 + rnd * 3.0);
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      gl_Position = projectionMatrix * mv;
      float lum = dot(vCol, vec3(0.333));
      gl_PointSize = max(1.0, uSpacing * uScale * (1.9 + e * 1.5) / -mv.z);
      vA = (1.0 - smoothstep(0.55, 1.0, l)) * mix(1.0, smoothstep(0.07, 0.4, lum), smoothstep(0.0, 0.35, l));
    }`,
  fragmentShader: `
    varying vec3 vCol; varying float vA;
    void main(){
      vec2 c = gl_PointCoord - 0.5; float a = exp(-dot(c,c) * 9.0);
      if (a * vA < 0.02) discard;
      gl_FragColor = vec4(vCol, a * vA);
      #include <colorspace_fragment>
    }`,
});
const pagePts = new THREE.Points(ptsGeo, ptsMat);
pagePts.frustumCulled = false;
pagePts.visible = false;
scene.add(pagePts);

/* ---------- the void ---------- */
const P0 = new THREE.Vector3(CX, CY, VOID_Z);
const voidU = {
  uFog: { value: 0.6 },
  uBg: { value: new THREE.Color(0x060504) },
  uPaper: { value: new THREE.Color(0xefe9df) },
  uInk: { value: new THREE.Color(0x050403) },
  uSepia: { value: new THREE.Color(0x8a6a4a) },
  uLight: { value: new THREE.Vector3(0.45, 0.75, 0.5).normalize() },
  uPx: { value: renderer.getPixelRatio() },
  uTime: shared.uTime,
};
const FOG_GLSL = `uniform float uFog; uniform vec3 uBg; float fogF(float d){ return 1.0 - exp(-uFog * uFog * d * d); }`;
const inkMat = new THREE.ShaderMaterial({
  uniforms: voidU,
  vertexShader: `
    varying vec3 vN; varying vec3 vW; varying float vDist;
    void main(){
      vN = normalize(mat3(modelMatrix) * normal);
      vec4 w = modelMatrix * vec4(position, 1.0); vW = w.xyz;
      vec4 mv = viewMatrix * w; vDist = -mv.z;
      gl_Position = projectionMatrix * mv;
    }`,
  fragmentShader: FOG_GLSL + `
    uniform vec3 uPaper; uniform vec3 uInk; uniform vec3 uSepia; uniform vec3 uLight; uniform float uPx;
    varying vec3 vN; varying vec3 vW; varying float vDist;
    void main(){
      vec3 n = normalize(vN);
      float d = max(dot(n, uLight), 0.0);
      vec3 v = normalize(cameraPosition - vW);
      float rim = pow(1.0 - abs(dot(n, v)), 3.0);
      vec2 p = gl_FragCoord.xy / uPx;
      float wob = sin(vW.y * 2.3 + vW.x * 1.7) * 2.0 + sin(vW.z * 3.1) * 1.2;
      float s = 9.0;
      float l1 = step(fract((p.x * 0.9 + p.y + wob) / s), 0.34);
      float l2 = step(fract((p.x - p.y * 0.8 - wob) / s), 0.3);
      float grit = fract(sin(dot(floor(p / 2.0), vec2(12.9898, 78.233))) * 43758.5453);
      float w = 0.0;
      if (d > 0.35) w = l1;
      if (d > 0.7) w = max(w, l2);
      if (d > 0.9) w = 1.0 - (1.0 - l1) * step(grit, 0.25);
      vec3 col = mix(uInk, uPaper, w);
      col = mix(col, uSepia * 0.45, step(0.96, grit) * (1.0 - w) * 0.6);
      col += uPaper * rim * rim * 0.5;
      col = mix(col, uBg, fogF(vDist));
      gl_FragColor = vec4(col, 1.0);

// tone and paper, with a sparse warm grain in the ink like the page's sepia wash.

        float otHash(float n) { return fract(sin(n) * 43758.5453123); }

      statements: ({ inputs: i, outputs: o }) => [`

        float id = float(${o.gsplat}.index);
        if (${i.suction} > 0.0) {

          vec3 core = vec3(0.0, 0.0, 1.25);
          vec3 d = c - core;

async function fetchJson(url) { const r = await fetch(url); if (!r.ok) throw new Error(`${url} ${r.status}`); return r.json(); }

// Load a world by id. Resolves once the splats are ready, or rejects.
function loadWorld(id) {
  worlds.loading = (async () => {
    await loadSpark();
    if (!worlds.list.length) {
      const [list, views, reliefs] = await Promise.all([
        fetchJson('worlds/worlds.json'), fetchJson('worlds/views.json').catch(() => ({})), fetchJson('worlds/reliefs.json').catch(() => ({ worlds: [] })),
      ]);
      // Marble worlds, then reliefs built from the page itself (tools/make_bob_head.py)
      worlds.list = [...(list.worlds || []), ...(reliefs.worlds || [])]; worlds.views = views;
    }
    const entry = worlds.list.find((w) => w.id === id);
    if (!entry) throw new Error(`no world ${id}`);
    const view = entry.relief ? entry : worlds.views[id] || {};
    const files = view.files || entry.splats;
    // the 100k files are too coarse to read as anything, so phones get 500k unless memory is short
    const lowMemory = (navigator.deviceMemory || 8) < 4;
    const url = (lowMemory && files['100k']) || files['500k'];
    if (worlds.mesh && worlds.id === id) return worlds.mesh;
    const mesh = new worlds.Spark.SplatMesh({ url, objectModifier: inkModifier() });
    await mesh.initialized;
    // swap only once the new world is ready, so there is never a gap
    if (worlds.mesh) { scene.remove(worlds.mesh); worlds.mesh.dispose?.(); }
    mesh.quaternion.set(1, 0, 0, 0);            // Marble's OpenCV axes (y down, +z ahead) to three's
    mesh.scale.setScalar(WORLD_SCALE);
    mesh.position.copy(P0);
    mesh.visible = state.stage === 'breach' || state.stage === 'void';
    scene.add(mesh);
    worlds.mesh = mesh; worlds.id = id; worlds.ok = true;
    // the grade measured from the world's crop by tools/clean_worlds.py; a relief is the page's own ink
    const g = view.grade;
    worlds.relief = !!entry.relief;
    worlds.u.grade.value = entry.relief ? 0 : 1;
    worlds.parallax = entry.parallax || 2.0;
    worlds.radius = view.radius || 1.2;
    if (g) {
      worlds.u.lo.value = g.lo; worlds.u.hi.value = g.hi;
      worlds.u.ink.value.fromArray(g.ink); worlds.u.mid.value.fromArray(g.mid); worlds.u.paper.value.fromArray(g.paper);
    }
    // look limits from tools/clean_worlds.py, in Marble's frame (yaw right is positive) to the camera's
    const y = view.yaw || [-180, 180], p = view.pitch || [-75, 75];
    worlds.limits = { yaw: [-y[1] * DEG, -y[0] * DEG], pitch: [p[0] * DEG, p[1] * DEG] };

  })();

}

function useWorld(on) {
  // the procedural void stays as the fallback; the world replaces it when present
  voidGroup.visible = !on && (state.stage === 'breach' || state.stage === 'void');
  if (worlds.mesh) worlds.mesh.visible = on;
}

function updateWorld(dt, t) {
  if (!worlds.mesh || !worlds.u) return;
  const u = worlds.u;
  if (state.stage === 'void' && !REVIEW && t > worlds.nextCrackle) {
    // the transmitter still crackles: a burst of static shears the world for a moment
    worlds.nextCrackle = t + 9 + Math.random() * 8;
    worlds.jitter = 1; sound.staticBurst();
  }
  worlds.jitter = Math.max(0, worlds.jitter - dt * 1.6);
  const changed = u.suction.value !== worlds.suction || worlds.jitter > 0 || u.jitter.value > 0;
  u.time.value = t; u.suction.value = worlds.suction; u.jitter.value = worlds.jitter;

      tbcCard.material.uniforms.uFlick.value = state.endT < 3.6 ? 1 : 0;
    }
    if (state.endT > 5 && !REVIEW) $('again').classList.add('show');
    if (state.endT > 6 && look.idle < 1) setHint('');
  }

  spinners.forEach((s) => { s.o.rotation.y += s.s * dt; s.o.rotation.x += s.s * 0.5 * dt; });
  sing.material.rotation += dt * 0.03;
  sing.scale.setScalar(46 + Math.sin(t * 0.7) * 2);
  updateWorld(rawDt, t);
  sound.update(dt, camera);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

Promise.all([loadTex(PAGE_SRC, true), loadTex(DEPTH_SRC, false)]).then(([page, depth]) => {
  depth.generateMipmaps = false; depth.minFilter = THREE.LinearFilter; depth.anisotropy = 1;
  shared.uPage.value = page; shared.uDepth.value = depth;
  resize();
  window.__ot = { state, breach, showBeat, BEATS, camera, worlds, look, parallax };
  requestAnimationFrame(frame);
}).catch((e) => { $('note').innerHTML = '<span class="err">The page artwork failed to load.</span>'; console.error(e); });
</script>
</body>
</html>
