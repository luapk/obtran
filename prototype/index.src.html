<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Oblivious Transfer 003</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23060504'/%3E%3Ccircle cx='16' cy='16' r='10' fill='none' stroke='%238a6a4a' stroke-width='1.5'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23efe9df'/%3E%3C/svg%3E">
<meta name="description" content="OBTRAN 003 comic page from Oblivious Transfer, read as an interactive 3D page.">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #060504;
    --paper: #efe9df;
    --sepia: #8a6a4a;
    --dim: rgba(239, 233, 223, 0.62);
    --bg: #060504;
  }
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--paper); overflow: hidden; }
  body { font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace; -webkit-tap-highlight-color: transparent; touch-action: none; user-select: none; -webkit-user-select: none; }
  canvas { display: block; position: fixed; inset: 0; width: 100%; height: 100%; }
  .vignette { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,0.55) 100%); }
  .grain { position: fixed; inset: -50%; pointer-events: none; opacity: 0.09; mix-blend-mode: screen; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); animation: grain 0.6s steps(4) infinite; }
  @keyframes grain { 0%{transform:translate(0,0)} 25%{transform:translate(-3%,2%)} 50%{transform:translate(2%,-3%)} 75%{transform:translate(-2%,-1%)} 100%{transform:translate(0,0)} }
  .flash { position: fixed; inset: 0; pointer-events: none; background: var(--paper); opacity: 0; mix-blend-mode: overlay; }
  /* a short film of Bob that cuts in full screen as he speaks (assets/films) */
  #film { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; }
  #film.on { opacity: 1; pointer-events: auto; animation: filmIn 0.16s steps(3, end); }
  #film video { display: none; width: 100%; height: 100%; object-fit: cover; filter: grayscale(1) contrast(1.08); }
  /* the films are portrait: on a wide screen show the whole frame with ink either side */
  @media (min-aspect-ratio: 4/5) { #film video { object-fit: contain; } }
  #film video.cur { display: block; }
  /* over the films (Paul): a super fine scan line, a slow rolling band, and an alien CCTV readout */
  #film::after { content: ''; position: absolute; inset: 0; pointer-events: none; background:
    repeating-linear-gradient(0deg, rgba(0,0,0,0.34) 0 1px, rgba(0,0,0,0) 1px 2px),
    linear-gradient(180deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.05) 48%, rgba(255,255,255,0) 52%);
    background-size: 100% 2px, 100% 300%; animation: scanRoll 6s linear infinite; }
  @keyframes scanRoll { from { background-position: 0 0, 0 0%; } to { background-position: 0 0, 0 -300%; } }
  /* the biometric touch screen for the hold: a looping top-down film of an alien touch pad, a code
     layer drawn where the thumb is, and the line's lettering */
  #pad { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity 0.45s; touch-action: none; }
  #pad.on { opacity: 1; pointer-events: auto; }
  /* a long press must reach the pad, not the video: on a video Android Chrome opens its own menu
     (download, picture in picture) and cancels the hold */
  #pad video, #film video { pointer-events: none; -webkit-touch-callout: none; }
  #pad, #film { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
  #pad video { display: block; width: 100%; height: 100%; object-fit: cover; filter: grayscale(1) contrast(1.05); }
  @media (min-aspect-ratio: 4/5) { #pad video { object-fit: contain; } }
  #pad::after { content: ''; position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(0deg, rgba(0,0,0,0.3) 0 1px, rgba(0,0,0,0) 1px 2px); }
  #padUI { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  /* top and height reset: the global canvas rule above pins every canvas to the top at full height */
  #padCard { position: absolute; top: auto; right: auto; left: 50%; bottom: 13%; height: auto; transform: translateX(-50%); width: min(86vw, 26vh * var(--a, 3)); pointer-events: none; }
  body.padOn #ring { display: none; }
  #cctv { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #filmCard { position: absolute; top: auto; right: auto; left: 50%; bottom: 13%; transform: translateX(-50%); width: min(86vw, 26vh * var(--a, 3)); height: auto; pointer-events: none; display: none; }
  #filmCard.show { display: block; animation: filmCardIn 0.45s cubic-bezier(.2,1.6,.4,1) both; }
  @keyframes filmCardIn { 0% { opacity: 0; transform: translateX(-50%) translateY(16px) scale(0.86); filter: brightness(1.8); } 40% { opacity: 1; } 100% { transform: translateX(-50%); filter: none; } }
  @keyframes filmIn { 0% { transform: translateX(-3%) scaleY(1.04); filter: brightness(2.2); } 60% { transform: translateX(1.5%); } 100% { transform: none; filter: none; } }
  /* the OT logo, white out of black (Paul), flashes up first: a couple of glitched frames (one inverted), a hold, then it cuts away */
  #intro { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; background: #050403; color: #efe9df; animation: introIn 0.9s linear both; }
  #intro svg { width: min(78vw, 66vh); height: auto; }
  /* scan lines and a slow rolling band over the logo, as over the films */
  #intro::after { content: ''; position: absolute; inset: 0; pointer-events: none; background:
    repeating-linear-gradient(0deg, rgba(0,0,0,0.42) 0 1px, rgba(0,0,0,0) 1px 3px),
    linear-gradient(180deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.06) 48%, rgba(255,255,255,0) 52%);
    background-size: 100% 3px, 100% 300%; animation: scanRoll 5s linear infinite; }
  /* it glitches out (Paul): sheared slices, an inverted frame, then a collapse to a bright line like a set switching off */
  #intro.out { animation: introOut 0.75s steps(1, end) forwards; pointer-events: none; }
  #intro.out svg { animation: introSlice 0.75s steps(1, end) forwards; }
  @keyframes introIn { 0% { opacity: 0; } 5% { opacity: 1; filter: invert(1); } 10% { opacity: 0; } 15% { opacity: 1; filter: none; transform: translateX(-2.5%) scaleY(1.03); } 19% { transform: none; } 100% { opacity: 1; } }
  @keyframes introOut { 0% { opacity: 1; } 12% { filter: invert(1); } 18% { filter: none; } 34% { filter: invert(1); } 40% { filter: none; transform: none; }
    62% { transform: scaleY(0.04); filter: brightness(3); } 74% { transform: scale(0.6, 0.006); filter: brightness(4); } 86% { transform: scale(0.02, 0.006); } 100% { opacity: 0; visibility: hidden; } }
  @keyframes introSlice { 0% { clip-path: none; transform: none; }
    6% { clip-path: polygon(0 0, 100% 0, 100% 38%, 0 38%, 0 46%, 100% 46%, 100% 100%, 0 100%); transform: translateX(-4%); }
    12% { clip-path: none; transform: translateX(3%) skewX(-6deg); }
    18% { clip-path: polygon(0 20%, 100% 20%, 100% 58%, 0 58%); transform: translateX(-7%); }
    26% { clip-path: polygon(0 0, 100% 0, 100% 64%, 0 64%, 0 71%, 100% 71%, 100% 100%, 0 100%); transform: translateX(5%) scaleY(1.06); }
    34% { clip-path: none; transform: translateX(-2%); }
    40% { transform: none; } }
  @media (prefers-reduced-motion: reduce) { #intro { animation: none; } #intro.out, #intro.out svg { animation: none; } #intro.out { opacity: 0; visibility: hidden; transition: opacity 0.4s; } }
  /* the music counter: a tab at the side, opening to the three tracks (assets/music/index.json) */
  #music[hidden] { display: none; }
  #music { position: fixed; z-index: 4; right: 14px; top: calc(max(14px, env(safe-area-inset-top)) + 46px); display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  #music .ui-btn { position: static; }
  #musicTab.unlocked { animation: tabFlash 1.2s steps(6, end); }
  @keyframes tabFlash { 0%, 33%, 66% { background: var(--paper); color: var(--ink); } 16%, 50%, 100% { background: rgba(6,5,4,0.7); color: var(--paper); } }
  #musicCount { color: var(--dim); margin-left: 0.4em; }
  #musicList { background: rgba(6,5,4,0.86); border: 1px solid rgba(239,233,223,0.25); padding: 0.7rem 0.8rem; width: min(17rem, calc(100vw - 28px)); font-size: 0.64rem; letter-spacing: 0.12em; text-transform: uppercase; }
  #musicList .mt-head { margin: 0 0 0.6rem; color: var(--dim); line-height: 1.5; }
  #musicTracks { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.4rem; }
  #musicTracks li { display: flex; align-items: center; justify-content: space-between; gap: 0.6rem; }
  #musicTracks li.locked { color: rgba(239,233,223,0.35); }
  #musicTracks button { font: inherit; color: var(--ink); background: var(--paper); border: 0; padding: 0.3rem 0.5rem; cursor: pointer; }
  #musicTracks button:disabled { background: rgba(239,233,223,0.2); color: var(--dim); cursor: default; }
  #musicBuy[hidden] { display: none; }
  #musicBuy { display: block; margin-top: 0.7rem; color: var(--paper); }
  #toast { position: fixed; z-index: 5; left: 50%; top: calc(max(14px, env(safe-area-inset-top)) + 4px); transform: translateX(-50%); background: var(--paper); color: var(--ink); font-size: 0.66rem; letter-spacing: 0.16em; text-transform: uppercase; padding: 0.5rem 0.8rem; opacity: 0; pointer-events: none; transition: opacity 0.3s; white-space: nowrap; }
  #toast.show { opacity: 1; }
  .black { position: fixed; inset: 0; pointer-events: none; background: #000; opacity: 0; transition: opacity 0.5s; }

  #gate { position: fixed; inset: 0; display: grid; place-items: center; background: #050403; z-index: 5; transition: opacity 0.6s; padding: 16px; }
  #gate.hide { opacity: 0; pointer-events: none; }
  .gate-card { text-align: center; max-width: 22rem; }
  .gate-card h1 { font-size: 0.95rem; letter-spacing: 0.32em; font-weight: 600; margin: 0 0 0.4rem; }
  .gate-card .cat { font-size: 0.72rem; letter-spacing: 0.24em; color: var(--dim); margin: 0 0 2rem; }
  .gate-card button { font: inherit; font-size: 0.85rem; letter-spacing: 0.2em; color: var(--ink); background: var(--paper); border: 0; padding: 0.95rem 2.2rem; cursor: pointer; clip-path: polygon(4% 0, 100% 0, 96% 100%, 0 100%); }
  .gate-card button:focus-visible { outline: 2px solid var(--sepia); outline-offset: 4px; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  .gate-card .lead { margin: 0 0 2rem; font-size: 0.82rem; line-height: 1.7; letter-spacing: 0.06em; }
  .gate-card .err { color: #d9a27a; }

  #hint { position: fixed; left: 50%; bottom: max(22px, env(safe-area-inset-bottom)); transform: translateX(-50%); font-size: 0.7rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--dim); background: rgba(6,5,4,0.7); padding: 0.55rem 0.9rem; z-index: 3; transition: opacity 0.4s; white-space: nowrap; pointer-events: none; }
  #hint.off { opacity: 0; }
  /* on the first scene the hint points up at the card */
  #hint.arrow::before { content: ''; position: absolute; left: 50%; bottom: 100%; width: 2px; height: 26px; margin-left: -1px; background: var(--paper); animation: hintArrow 1.4s ease-in-out infinite; }
  #hint.arrow::after { content: ''; position: absolute; left: 50%; bottom: calc(100% + 22px); width: 10px; height: 10px; margin-left: -6px; border-left: 2px solid var(--paper); border-top: 2px solid var(--paper); transform: rotate(45deg); animation: hintArrow 1.4s ease-in-out infinite; }
  @keyframes hintArrow { 0%, 100% { translate: 0 0; } 50% { translate: 0 -6px; } }
  #hint.nudge { animation: nudge 0.4s; }
  @keyframes nudge { 0%,100%{transform:translateX(-50%)} 25%{transform:translateX(calc(-50% - 6px))} 75%{transform:translateX(calc(-50% + 6px))} }

  .ui-btn { position: fixed; z-index: 4; font: inherit; font-size: 0.66rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--paper); background: rgba(6,5,4,0.7); border: 1px solid rgba(239,233,223,0.25); padding: 0.5rem 0.7rem; cursor: pointer; }
  #mute { top: max(14px, env(safe-area-inset-top)); right: 14px; }
  #again { left: 50%; bottom: max(70px, calc(env(safe-area-inset-bottom) + 56px)); transform: translateX(-50%); opacity: 0; pointer-events: none; transition: opacity 0.8s; }
  #again.show { opacity: 1; pointer-events: auto; }

  #review { position: fixed; left: 14px; top: max(14px, env(safe-area-inset-top)); z-index: 4; display: flex; flex-wrap: wrap; gap: 6px; max-width: calc(100% - 120px); }
  #review .ui-btn { position: static; }
  #review .ui-btn[aria-pressed="true"] { background: var(--paper); color: var(--ink); }
  @media (max-width: 600px) { #review { gap: 4px; } #review .ui-btn { font-size: 0.56rem; letter-spacing: 0.1em; padding: 0.35rem 0.45rem; } }
  #ring { position: fixed; width: 96px; height: 96px; margin: -48px 0 0 -48px; pointer-events: none; z-index: 4; opacity: 0; transition: opacity 0.2s; }
  #ring.on { opacity: 1; }
  #ring { --p: 0; transition: opacity 0.2s, transform 0.08s; filter: drop-shadow(0 0 calc(4px + 14px * var(--p)) rgba(239, 233, 223, calc(0.35 + 0.6 * var(--p)))); }
  #fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #ring circle { fill: none; stroke-width: 4; }
  #ring .track { stroke: rgba(239,233,223,0.2); }
  #ring .prog { stroke: var(--paper); stroke-linecap: square; transform: rotate(-90deg); transform-origin: 50% 50%; }

  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>

<body>
<!-- the OT logo, full screen, before anything else loads (Paul, 24 October); drawn from the label's logo -->
<div id="intro"><svg viewBox="0 0 467 490" role="img" aria-label="Oblivious Transfer"><g fill="none" stroke="currentColor" stroke-width="22"><rect x="62" y="73" width="62" height="116" rx="31"/><path d="M212 131 H330 A100 100 0 0 1 430 231 V246"/><path d="M108 246 V255 A100 100 0 0 0 208 355 H296"/><path d="M330 304 H440 M385 304 V428"/></g></svg></div>
<script>window.__introT0 = performance.now(); setTimeout(() => document.getElementById('intro')?.classList.add('out'), 10000);</script>
<div id="film" aria-hidden="true"><canvas id="cctv"></canvas><canvas id="filmCard"></canvas></div>

<div id="gate" role="dialog" aria-label="Start">
  <div class="gate-card">
    <h1 class="sr-only">Oblivious Transfer: OBTRAN 003</h1>
    <!-- one sentence after the logo, then the comic (Paul, 24 October) -->
    <p class="lead" id="note">Turn your sound on and follow Bob's story through the page, exploring to unlock tracks.</p>
    <button id="start" type="button">START</button>

</div>

<div id="hint" class="off">Tap to continue</div>

  <button id="musicTab" class="ui-btn" type="button" aria-expanded="false" aria-controls="musicList"><span class="mt-name">QNTM CTRL</span> <span id="musicCount">0/3</span></button>
  <div id="musicList" hidden>
    <p class="mt-head">Explore to unlock tracks</p>

</div>

<script type="module">
import * as THREE from 'three';

const PAGE_SRC = '%%PAGE_SRC%%';
const DEPTH_SRC = '%%DEPTH_SRC%%';
const META = %%META%%;

/* ---------- constants ---------- */
const PW = 2.0;
const PH = PW * META.aspect;
const DEPTH_SCALE = 0.9;
const CX = (META.centre[0] - 0.5) * PW;
const CY = (0.5 - META.centre[1]) * PH;
const VOID_Z = -26;
const BREACH_DUR = 4.8;
const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const isTouch = matchMedia('(pointer: coarse)').matches;

const HOLD_DUR = 1.4;                     // seconds of press and hold to unlock
const BEATS = [
  { b: 'caption' },
  { b: 'crsh', fx: 'static', cut: 0.9 },          // cut: cuts straight into the next space this many seconds in, on its static
  { b: 'smoke1', fx: 'blip', auto: 1.1 },          // auto: moves on by itself this many seconds after its line (and film) end
  { b: 'engage', fx: 'blip' },
  { b: 'bob1' },
  { b: 'drill', fx: 'blip' },
  { b: 'unlock', fx: 'blip', hold: true },
  { b: 'holy', auto: 1.4 },
  { b: 'qntm', trigger: true, auto: 1.8 },
];

const $ = (id) => document.getElementById(id);
const hintEl = $('hint');
const tapWord = isTouch ? 'Tap' : 'Click';

function uvToWorld(u, v) { return new THREE.Vector2((u - 0.5) * PW, (0.5 - v) * PH); }
function clamp(x, a, b) { return Math.min(b, Math.max(a, x)); }
function lerp(a, b, t) { return a + (b - a) * t; }
function ease(t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }
function smooth(e0, e1, x) { const t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); }

/* ---------- renderer ---------- */
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
  if (!renderer.capabilities.isWebGL2) throw new Error('WebGL2 not available');
} catch (e) {
  $('note').innerHTML = '<span class="err">This browser cannot run the 3D page (WebGL2 is unavailable).</span>';
  $('start').disabled = true;
  throw e;
}
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x060504, 1);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x060504);
const PAGE_FOV = 40;                     // the page's own lens
const camera = new THREE.PerspectiveCamera(PAGE_FOV, innerWidth / innerHeight, 0.01, 800);
camera.rotation.order = 'YXZ';
scene.add(camera);

/* ---------- textures ---------- */
const loader = new THREE.TextureLoader();
function loadTex(src, srgb) {
  return new Promise((res, rej) => loader.load(src, (t) => {
    t.flipY = false;
    t.colorSpace = srgb ? THREE.SRGBColorSpace : THREE.NoColorSpace;
    t.minFilter = THREE.LinearMipmapLinearFilter;
    t.magFilter = THREE.LinearFilter;
    t.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
    t.generateMipmaps = true;
    res(t);
  }, undefined, rej));
}

const shared = {
  uPage: { value: null },
  uDepth: { value: null },
  uDepthScale: { value: DEPTH_SCALE },
  uTime: { value: 0 },
  uAgit: { value: 0 },
  uFlash: { value: 0 },
  uCentre: { value: new THREE.Vector2(META.centre[0], META.centre[1]) },
  uAspect: { value: META.aspect },
  uPageSize: { value: new THREE.Vector2(PW, PH) },
};

const GLSL_COMMON = `
  uniform sampler2D uPage;
  uniform sampler2D uDepth;
  uniform float uDepthScale;
  uniform float uTime;
  uniform float uAgit;
  uniform vec2 uCentre;
  uniform float uAspect;
  uniform vec2 uPageSize;
  float depthAt(vec2 puv) { return (texture2D(uDepth, puv).r * 2.0 - 1.0) * uDepthScale; }
  float coreR(vec2 puv) { vec2 d = puv - uCentre; d.y *= uAspect; return length(d); }
  vec3 pagePos(vec2 puv) {
    float z = depthAt(puv);
    float r = coreR(puv);
    float k = exp(-pow(r / 0.16, 2.0));
    z += uAgit * k * 0.035 * sin(uTime * 37.0 + puv.x * 80.0 + puv.y * 63.0);
    z -= uAgit * k * 0.12;
    return vec3((puv.x - 0.5) * uPageSize.x, (0.5 - puv.y) * uPageSize.y, z);
  }
  float hash(float n) { return fract(sin(n) * 43758.5453123); }
`;

/* ---------- page mesh (2.5D relief) ---------- */
const bubbleRects = META.bubbles.map((b) => new THREE.Vector4(...b.uv));
const lifts = new Array(10).fill(0);
const pageMat = new THREE.ShaderMaterial({
  uniforms: {
    ...shared,
    uRects: { value: bubbleRects },
    uLifts: { value: lifts },
    uOpacity: { value: 1 },
    uPanelGlow: { value: 0 },
  },
  transparent: true,
  vertexShader: GLSL_COMMON + `
    varying vec2 vPuv;
    void main() {
      vPuv = vec2(uv.x, 1.0 - uv.y);
      vec3 p = pagePos(vPuv);
      gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
    }`,
  fragmentShader: GLSL_COMMON + `
    uniform vec4 uRects[10];
    uniform float uLifts[10];
    uniform float uOpacity;
    uniform float uFlash;
    uniform float uPanelGlow;
    varying vec2 vPuv;
    void main() {
      vec3 col = texture2D(uPage, vPuv).rgb;
      // "tap to enter": a faint halo around Bob's panel (the depth map's blue channel is its mask)
      if (uPanelGlow > 0.002) {
        float pm = texture2D(uDepth, vPuv).b, halo = 0.0;

  Spark: null, ok: false, list: [], views: {}, id: null, mesh: null, loading: null,
  limits: { yaw: [-Math.PI, Math.PI], pitch: [-1.3, 1.3] }, parallax: 2.0, offset: new THREE.Vector3(),
  radius: 1.2, wander: new THREE.Vector3(), wanderT: null, suctionTarget: 0, suctionRate: 0.18, echoes: [], extrudeOn: params.get('extrude') !== '0', lastTick: -1,
  sandMesh: null, sandOn: params.get('sand') !== '0',
  u: null, suction: 0, jitter: 0, nextCrackle: 0, drift: new THREE.Vector3(),
};

async function loadSpark() {
  if (worlds.Spark) return worlds.Spark;
  worlds.Spark = await import('@sparkjsdev/spark');
  const { dyno } = worlds.Spark;
  worlds.u = {
    time: dyno.dynoFloat(0), grade: dyno.dynoFloat(1), suction: dyno.dynoFloat(0), jitter: dyno.dynoFloat(0),
    lo: dyno.dynoFloat(0.15), hi: dyno.dynoFloat(0.3), grit: dyno.dynoFloat(0.04), grain: dyno.dynoFloat(0.22), size: dyno.dynoFloat(0.88),
    extrude: dyno.dynoFloat(1), sand: dyno.dynoFloat(1), cut: dyno.dynoFloat(0),
    ink: dyno.dynoVec3(new THREE.Vector3(0.020, 0.016, 0.012)),
    mid: dyno.dynoVec3(new THREE.Vector3(0.300, 0.300, 0.270)),
    paper: dyno.dynoVec3(new THREE.Vector3(0.937, 0.914, 0.875)),
  };
  const spark = new worlds.Spark.SparkRenderer({ renderer });
  spark.renderOrder = -10;   // splats first: the nucleus is drawn over them, the 3D shapes over that
  scene.add(spark);
  return worlds.Spark;
}

// Per splat, on the GPU: pull towards the core and swirl (suction), shear in bands
// like a bad transmission (jitter), threshold the colour to the crop's ink, mid tone
// and paper with a sparse warm grain in the ink like the page's sepia wash, then
// extrude: a Marble world is a thin shell around its viewpoint, so splats are moved
// along their line of sight to break it into layers. Paper lines come forward, the
// shell is cut into angular blocks that each slip to their own depth (a few jump now
// and then), and some splats stretch into streaks pointing at the viewer. Echo layers
// (the same world again, nearer and fainter, bright ink only) add ghost depth.
function inkModifier(layer = { depth: 1, alpha: 1, brightOnly: 0 }) {
  const { dyno } = worlds.Spark;
  const u = { ...worlds.u, depth: dyno.dynoFloat(layer.depth), alpha: dyno.dynoFloat(layer.alpha), brightOnly: dyno.dynoFloat(layer.brightOnly) };
  return dyno.dynoBlock({ gsplat: dyno.Gsplat }, { gsplat: dyno.Gsplat }, ({ gsplat }) => {
    const node = dyno.dyno({
      inTypes: {
        gsplat: dyno.Gsplat, time: 'float', grade: 'float', suction: 'float', jitter: 'float', lo: 'float', hi: 'float',
        grit: 'float', grain: 'float', size: 'float', ink: 'vec3', mid: 'vec3', paper: 'vec3',
        extrude: 'float', depth: 'float', alpha: 'float', brightOnly: 'float', cut: 'float',
      },
      outTypes: { gsplat: dyno.Gsplat },
      inputs: { gsplat, ...u },
      globals: () => [dyno.defineGsplat, `
        float otHash(float n) { return fract(sin(n) * 43758.5453123); }
      `],
      statements: ({ inputs: i, outputs: o }) => [`
        ${o.gsplat} = ${i.gsplat};
        vec3 c = ${o.gsplat}.center;
        float id = float(${o.gsplat}.index);
        if (${i.cut} > 0.0) {
          // the slab cut out of the singularity to float as a card (SLAB, tools/cut_slab.py):
          // its own splats, by direction from the viewpoint and distance, are dropped
          float cl = length(c);
          vec2 ang = vec2(degrees(atan(c.x, c.z)), degrees(asin(clamp(-c.y / max(cl, 1e-4), -1.0, 1.0)))) - vec2(${SLAB.hide.centre[0].toFixed(2)}, ${SLAB.hide.centre[1].toFixed(2)});
          float ca = cos(radians(${SLAB.hide.angle.toFixed(2)})), sa = sin(radians(${SLAB.hide.angle.toFixed(2)}));
          vec2 q = vec2(ang.x * ca + ang.y * sa, -ang.x * sa + ang.y * ca);
          if (abs(q.x) < ${SLAB.hide.half[0].toFixed(2)} && abs(q.y) < ${SLAB.hide.half[1].toFixed(2)} && cl > ${SLAB.hide.dist[0].toFixed(2)} && cl < ${SLAB.hide.dist[1].toFixed(2)}) {
            ${o.gsplat}.rgba.a = 0.0;
            ${o.gsplat}.scales *= 0.0;
          }
        }
        if (${i.suction} > 0.0) {
          // the core sits straight ahead of the viewpoint (Marble's +z)
          vec3 core = vec3(0.0, 0.0, 1.25);
          vec3 d = c - core;
          float r = length(d.xy);
          float a = ${i.suction} * (2.5 + 5.0 / (r + 0.3)) * (0.75 + 0.5 * otHash(id));
          float cs = cos(a), sn = sin(a);
          d.xy = vec2(d.x * cs - d.y * sn, d.x * sn + d.y * cs);
          float pull = ${i.suction} * ${i.suction};
          c = core + d * (1.0 - 0.96 * pull);
          ${o.gsplat}.scales *= 1.0 - 0.7 * pull;
        }
        if (${i.jitter} > 0.0) {
          float band = floor(c.y * 34.0) + floor(${i.time} * 22.0) * 7.0;
          float h = otHash(band);
          c.x += (h - 0.5) * ${i.jitter} * step(0.55, h) * 0.12;
          c.z += (otHash(id + floor(${i.time} * 30.0)) - 0.5) * ${i.jitter} * 0.01;
        }
        vec3 rgb = ${o.gsplat}.rgba.rgb;
        float lum = dot(rgb, vec3(0.299, 0.587, 0.114)) + (otHash(id * 0.618) - 0.5) * ${i.grit};
        float w = max(0.004, (${i.hi} - ${i.lo}) * 0.25);
        float midW = smoothstep(${i.lo} - w, ${i.lo} + w, lum);
        float paperW = smoothstep(${i.hi} - w, ${i.hi} + w, lum);
        vec3 grainy = mix(${i.ink}, vec3(0.32, 0.25, 0.17), step(1.0 - ${i.grain}, otHash(id * 1.37)) * 0.55);
        vec3 inked = mix(mix(grainy, ${i.mid}, midW), ${i.paper}, paperW);
        inked *= 1.0 + ${i.jitter} * 0.6 * step(0.8, otHash(floor(c.y * 34.0) + floor(${i.time} * 22.0)));
        ${o.gsplat}.rgba.rgb = mix(rgb, inked, ${i.grade});
        ${o.gsplat}.scales *= mix(1.0, ${i.size}, ${i.grade});
        float d = length(c);
        if ((${i.extrude} > 0.0 || ${i.depth} != 1.0) && d > 1e-4) {
          vec3 dir = c / d;
          float ex = ${i.extrude};
          vec2 cell = floor(vec2(atan(dir.x, dir.z) * 9.0, asin(clamp(-dir.y, -1.0, 1.0)) * 7.0));
          float cellId = cell.x * 37.0 + cell.y * 101.0;
          float slip = otHash(cellId);
          float epoch = floor(${i.time} * 0.35 + otHash(cellId * 3.1) * 4.0);
          float jump = step(0.86, otHash(cellId + epoch * 13.0)) * (otHash(cellId * 7.0 + epoch) - 0.5);
          float pull = ex * (0.26 * paperW + 0.1 * midW + 0.16 * slip * step(0.5, slip) + 0.24 * jump);
          // shrink each splat by the factor it moves, so from the viewpoint the drawing looks
          // as it did and the layers only show as the camera moves
          float k = ${i.depth} * clamp(1.0 - pull, 0.3, 1.3);
          c = dir * d * k;
          ${o.gsplat}.scales *= k;
          // a few streaks, half of them ink smears rather than light, so they never wash the page out
          if (otHash(id * 2.7) < 0.022 * ex && (paperW > 0.5 || otHash(id * 5.3) < 0.5)) {
            // a streak: the splat turned to face along the line of sight and drawn out
            vec3 sc = ${o.gsplat}.scales;
            float thin = min(sc.x, sc.y);
            vec3 axis = vec3(-dir.y, dir.x, 0.0);             // cross((0, 0, 1), dir)
            float wq = 1.0 + dir.z;
            ${o.gsplat}.quaternion = wq > 1e-4 ? normalize(vec4(axis, wq)) : vec4(1.0, 0.0, 0.0, 0.0);
            ${o.gsplat}.scales = vec3(thin, thin, max(sc.x, sc.y) * (1.0 + 3.0 * ex * (0.4 + paperW)));
            ${o.gsplat}.rgba.a *= 0.7;
          }
        }
        ${o.gsplat}.center = c;
        ${o.gsplat}.rgba.a *= ${i.alpha} * mix(1.0, paperW, ${i.brightOnly});
      `],
    });
    return { gsplat: node.outputs.gsplat };
  });
}

function worldMeshes() { return worlds.mesh ? [worlds.mesh, ...worlds.echoes, ...(worlds.sandMesh ? [worlds.sandMesh] : [])] : []; }

// Sands of time: the world's lighter splat file again, shrunk to grains and spread
// through the space between the viewer and the world. They swirl about the line of
// sight towards the core (faster near the centre) and are flung slowly outward as they
// drift towards the viewer, then fade and start again. Coarse cells of space are dense
// or sparse, so the grains gather in drifts. Every depth holding something that moves is
// what makes the space read in 3D.
function sandModifier() {
  const { dyno } = worlds.Spark, u = worlds.u;
  return dyno.dynoBlock({ gsplat: dyno.Gsplat }, { gsplat: dyno.Gsplat }, ({ gsplat }) => {
    const node = dyno.dyno({
      inTypes: { gsplat: dyno.Gsplat, time: 'float', sand: 'float', paper: 'vec3' },
      outTypes: { gsplat: dyno.Gsplat },
      inputs: { gsplat, time: u.time, sand: u.sand, paper: u.paper },
      globals: () => [dyno.defineGsplat, `
        float otSandHash(float n) { return fract(sin(n) * 43758.5453123); }
      `],
      statements: ({ inputs: i, outputs: o }) => [`
        ${o.gsplat} = ${i.gsplat};
        vec3 c = ${o.gsplat}.center;
        float id = float(${o.gsplat}.index);
        float h1 = otSandHash(id * 0.731), h2 = otSandHash(id * 1.913), h3 = otSandHash(id * 2.477), h4 = otSandHash(id * 3.119);
        float d = max(length(c), 1e-4);
        vec3 dir = c / d;
        // drifts: coarse cells of space are dense or sparse
        float dens = otSandHash(dot(floor(c * 2.2), vec3(17.0, 59.0, 113.0)));
        // sand scales how many grains show: 1 in Marble worlds, less over a relief so the face reads
        float keep = step(1.0 - ${i.sand} * (0.03 + 0.9 * smoothstep(0.62, 0.97, dens)), h4);
        // start anywhere between the viewer and the world
        vec3 p0 = dir * d * mix(0.2, 0.95, h1);
        float cyc = fract(${i.time} * (0.015 + 0.025 * h2) + h3);
        float r0 = length(p0.xy) + 0.02;
        float r = r0 * (0.55 + 1.1 * cyc);                                  // flung outward
        float a = atan(p0.y, p0.x) + ${i.time} * 0.2 / (0.25 + r) * (0.8 + 0.4 * h2);   // swirl, faster near the axis
        float z = p0.z - cyc * 0.3 * d;                                      // drifting towards the viewer
        ${o.gsplat}.center = vec3(cos(a) * r, sin(a) * r, z);
        float len = length(${o.gsplat}.center);
        float g = 0.0008 * len + 0.00015;                                     // fine grains, about the same size on screen
        // drawn out a little along the swirl, like sand in a long exposure
        float th = 0.5 * (a + 1.5708);
        ${o.gsplat}.quaternion = vec4(0.0, 0.0, sin(th), cos(th));
        // 30% are data points (Paul): about a quarter the size, round, and pure white so they stay crisp
        float dataPt = step(fract(h2 * 13.7 + h3 * 7.1), 0.3);
        ${o.gsplat}.scales = mix(vec3(g * (1.5 + 2.5 * h2), g, g), vec3(g * 0.28), dataPt);
        vec3 col = mix(mix(${i.paper}, vec3(0.62, 0.48, 0.33), step(0.72, h3)), vec3(1.0), dataPt);
        // opacity above 1 gives Spark a hard edge, so a grain reads as a point rather than a soft blob
        // no grains right at the viewpoint, where they would fill the screen
        float near = smoothstep(0.22, 0.38, len);
        ${o.gsplat}.rgba = vec4(col, keep * near * sin(3.14159 * cyc) * 1.8);
      `],
    });
    return { gsplat: node.outputs.gsplat };
  });
}

async function fetchJson(url) { const r = await fetch(url); if (!r.ok) throw new Error(`${url} ${r.status}`); return r.json(); }

// Load a world by id. Resolves once the splats are ready, or rejects.
function loadWorld(id) {
  worlds.loading = (async () => {
    await loadSpark();
    if (!worlds.list.length) {
      const [list, views, reliefs] = await Promise.all([
        fetchJson('worlds/worlds.json'), fetchJson('worlds/views.json').catch(() => ({})), fetchJson('worlds/reliefs.json').catch(() => ({ worlds: [] })),
      ]);
      // Marble worlds, then reliefs built from the page itself (tools/make_bob_head.py)
      worlds.list = [...(list.worlds || []), ...(reliefs.worlds || [])]; worlds.views = views;
    }
    const entry = worlds.list.find((w) => w.id === id);
    if (!entry) throw new Error(`no world ${id}`);
    const view = entry.relief ? entry : worlds.views[id] || {};
    const files = view.files || entry.splats;
    // the 100k files are too coarse to read as anything, so phones get 500k unless memory is short
    const lowMemory = (navigator.deviceMemory || 8) < 4;
    const url = (lowMemory && files['100k']) || files['500k'];
    if (worlds.mesh && worlds.id === id) return worlds.mesh;
    const mesh = new worlds.Spark.SplatMesh({ url, objectModifier: inkModifier() });
    // echo layers: the lighter file again, nearer and fainter, bright ink only (not for reliefs)
    const echoes = entry.relief ? [] : [[0.8, 0.14], [0.64, 0.07]].map(([depth, alpha]) =>
      new worlds.Spark.SplatMesh({ url: files['100k'] || url, objectModifier: inkModifier({ depth, alpha, brightOnly: 1 }) }));
    const sandMesh = worlds.sandOn || REVIEW ? new worlds.Spark.SplatMesh({ url: files['100k'] || url, objectModifier: sandModifier() }) : null;
    await Promise.all([mesh.initialized, ...echoes.map((e) => e.initialized), ...(sandMesh ? [sandMesh.initialized] : [])]);
    // swap only once the new world is ready, so there is never a gap
    for (const old of worldMeshes()) { scene.remove(old); old.dispose?.(); }
    for (const m of [mesh, ...echoes, ...(sandMesh ? [sandMesh] : [])]) {
      m.quaternion.set(1, 0, 0, 0);            // Marble's OpenCV axes (y down, +z ahead) to three's
      m.scale.setScalar(WORLD_SCALE);
      m.position.copy(P0);
      m.visible = state.stage === 'breach' || state.stage === 'void';
      scene.add(m);
    }
    worlds.mesh = mesh; worlds.echoes = echoes; worlds.sandMesh = sandMesh; worlds.id = id; worlds.ok = true;
    worlds.u.sand.value = worlds.sandOn && !reducedMotion ? (entry.relief ? RELIEF_SAND : 1) : 0;
    worlds.u.cut.value = id === STORY_WORLD && slab.on ? 1 : 0;   // the slab floats free here, so its splats go
    // the grade measured from the world's crop by tools/clean_worlds.py; a relief is the page's own ink
    const g = view.grade;
    worlds.relief = !!entry.relief;
    worlds.u.grade.value = entry.relief ? 0 : 1;
    worlds.u.extrude.value = entry.relief ? 0 : worlds.extrudeOn ? 1 : 0;
    worlds.parallax = entry.parallax || 2.0;
    worlds.radius = view.radius || 1.2;
    if (g) {
      worlds.u.lo.value = g.lo; worlds.u.hi.value = g.hi;
      worlds.u.ink.value.fromArray(g.ink); worlds.u.mid.value.fromArray(g.mid); worlds.u.paper.value.fromArray(g.paper);
    }
    // look limits from tools/clean_worlds.py, in Marble's frame (yaw right is positive) to the camera's
    const y = view.yaw || [-180, 180], p = view.pitch || [-75, 75];
    worlds.limits = { yaw: [-y[1] * DEG, -y[0] * DEG], pitch: [p[0] * DEG, p[1] * DEG] };
    return mesh;
  })();
  return worlds.loading;
}

function useWorld(on) {
  // the procedural void stays as the fallback; the world replaces it when present
  voidGroup.visible = !on && (state.stage === 'breach' || state.stage === 'void');
  for (const m of worldMeshes()) m.visible = on;
}

function updateWorld(dt, t) {
  if (!worlds.mesh || !worlds.u) return;
  const u = worlds.u;
  if (state.stage === 'void' && !REVIEW && (!journey.on || journey.done) && t > worlds.nextCrackle) {
    // the transmitter still crackles: a burst of static shears the world for a moment
    worlds.nextCrackle = t + 9 + Math.random() * 8;
    worlds.jitter = 1; sound.staticBurst();
  }
  worlds.jitter = Math.max(0, worlds.jitter - dt * 1.6);
  // the extrusion's blocks jump on a clock, so it needs a refresh about ten times a second
  const tick = u.extrude.value > 0 ? Math.floor(t * 10) : -1;
  const changed = u.suction.value !== worlds.suction || worlds.jitter > 0 || u.jitter.value > 0 || tick !== worlds.lastTick;
  worlds.lastTick = tick;
  u.time.value = t; u.suction.value = worlds.suction; u.jitter.value = worlds.jitter;
  if (changed) for (const m of worldMeshes()) m.updateVersion();
  else if (worlds.sandMesh && u.sand.value > 0) worlds.sandMesh.updateVersion();   // the sand moves every frame
}

/* ---------- sound ---------- */
class Sound {
  constructor() { this.ok = false; this.muted = false; this.voices = []; }
  start() {
    try {
      const C = window.AudioContext || window.webkitAudioContext;
      this.ctx = new C();
    } catch (e) { return; }
    const ctx = this.ctx; this.ok = true;
    this.master = ctx.createGain(); this.master.gain.value = 0.85;
    const comp = ctx.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 4;
    this.master.connect(comp).connect(ctx.destination);
    this.noise = this.makeNoise(2);
    // cabin: muffled hum plus tape hiss
    this.cabinLP = ctx.createBiquadFilter(); this.cabinLP.type = 'lowpass'; this.cabinLP.frequency.value = 320; this.cabinLP.Q.value = 0.7;
    this.cabin = ctx.createGain(); this.cabin.gain.value = 0;
    this.cabinLP.connect(this.cabin).connect(this.master);
    [[55, 'sawtooth', 0.05], [55.35, 'sawtooth', 0.05], [110.2, 'sine', 0.04], [27.5, 'sine', 0.12]].forEach(([f, t, g]) => {
      const o = ctx.createOscillator(); o.type = t; o.frequency.value = f; const gg = ctx.createGain(); gg.gain.value = g; o.connect(gg).connect(this.cabinLP); o.start();
    });
    const hiss = ctx.createBufferSource(); hiss.buffer = this.noise; hiss.loop = true;
    const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 5000;
    this.hiss = ctx.createGain(); this.hiss.gain.value = 0.012;
    hiss.connect(hp).connect(this.hiss).connect(this.master); hiss.start();
    this.cabin.gain.setTargetAtTime(1, ctx.currentTime, 1.2);
    this.reverb = ctx.createConvolver(); this.reverb.buffer = this.makeIR(4.5);
    this.wet = ctx.createGain(); this.wet.gain.value = 0.6; this.reverb.connect(this.wet).connect(this.master);
    this.loadVoices();
  }
  makeNoise(sec) { const ctx = this.ctx, b = ctx.createBuffer(1, ctx.sampleRate * sec, ctx.sampleRate), d = b.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; return b; }
  makeIR(sec) { const ctx = this.ctx, n = ctx.sampleRate * sec, b = ctx.createBuffer(2, n, ctx.sampleRate); for (let c = 0; c < 2; c++) { const d = b.getChannelData(c); for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2.6); } return b; }
  now() { return this.ctx.currentTime; }
  staticBurst(len = 0.65) {
    if (!this.ok) return; const ctx = this.ctx, t = this.now();
    const s = ctx.createBufferSource(); s.buffer = this.noise;
    const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 0.9; bp.frequency.setValueAtTime(900, t); bp.frequency.exponentialRampToValueAtTime(3200, t + 0.5);
    const g = ctx.createGain(); g.gain.setValueAtTime(0, t);
    for (let i = 0; i < Math.round(len / 0.045) + 1; i++) g.gain.setValueAtTime(Math.random() * 0.55, t + i * 0.045);
    g.gain.setTargetAtTime(0, t + len, 0.08);
    s.connect(bp).connect(g).connect(this.master); s.start(t); s.stop(t + len + 0.6);
  }
  blip() {
    if (!this.ok) return; const ctx = this.ctx, t = this.now();
    [0, 0.09].forEach((dt, i) => {
      const o = ctx.createOscillator(); o.type = 'square'; o.frequency.value = i ? 1180 : 1560;
      const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1500; bp.Q.value = 3;
      const g = ctx.createGain(); g.gain.setValueAtTime(0.0, t + dt); g.gain.linearRampToValueAtTime(0.06, t + dt + 0.005); g.gain.setTargetAtTime(0, t + dt + 0.05, 0.015);
      o.connect(bp).connect(g).connect(this.master); o.start(t + dt); o.stop(t + dt + 0.2);
    });
  }
  holdStart() {
    if (!this.ok) return; const ctx = this.ctx, t = this.now();
    const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.setValueAtTime(180, t); o.frequency.exponentialRampToValueAtTime(760, t + 1.4);
    const g = ctx.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.08, t + 0.15);
    o.connect(g).connect(this.master); o.start(t); this.holdOsc = { o, g };
  }
  holdStop(success) {
    if (!this.ok || !this.holdOsc) return; const t = this.now();
    this.holdOsc.g.gain.setTargetAtTime(0, t, 0.03); this.holdOsc.o.stop(t + 0.3); this.holdOsc = null;
    if (success) [880, 1320].forEach((f, i) => { const o = this.ctx.createOscillator(); o.frequency.value = f; const g = this.ctx.createGain(); g.gain.setValueAtTime(0.07, t + i * 0.08); g.gain.setTargetAtTime(0, t + i * 0.08 + 0.05, 0.04); o.connect(g).connect(this.master); o.start(t + i * 0.08); o.stop(t + i * 0.08 + 0.4); });
  }
  breach(dur) {
    if (!this.ok) return; const ctx = this.ctx, t = this.now();
    const s = ctx.createBufferSource(); s.buffer = this.noise; s.loop = true;
    const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 1.2; bp.frequency.setValueAtTime(180, t); bp.frequency.exponentialRampToValueAtTime(7000, t + dur * 0.7);
    const g = ctx.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.45, t + dur * 0.68); g.gain.linearRampToValueAtTime(0, t + dur * 0.74);
    s.connect(bp).connect(g).connect(this.master); s.start(t); s.stop(t + dur);

// ---------- the biometric touch screen (Paul, 24 October) ----------
// For the press and hold: a top-down film of an alien touch pad (films/index.json clip "touchpad",

// layer in the photo's style answers the touch where it lands: crosshair lines to the screen's edges
// with coordinate readouts, counter-turning segmented rings, a scan line sweeping a bracket that

const pad = { el: $('pad'), ui: $('padUI'), ctx: null, on: false, t: 0, burst: -1, video: null };

  pad.video.play?.().catch(() => {});

for (const el of [pad.el, $('film')]) el.addEventListener('contextmenu', (e) => e.preventDefault());
pad.el.addEventListener('pointerdown', (e) => { e.stopPropagation(); lastInput = performance.now(); if (!state.holding && pad.burst < 0) startHold(e.clientX, e.clientY); });

function prefetchFilm(beat) { const cue = filmCue(beat); if (cue) filmVideo(cue.clip).load(); }
// called from the Start tap: starting and stopping each film inside the reader's own gesture
// lets phones that block a page's own video playback (data saver, low power) play them later
function primeFilms() {
  if (!films.index?.clips || REVIEW) return;
  for (const id of Object.keys(films.index.clips)) {
    const v = filmVideo(id);
    v.play().then(() => { if (!films.on || !v.classList.contains('cur')) v.pause(); }).catch(() => { /* tried again at its cue */ });
  }
}
function playFilm(beat) {
  stopFilm(false);
  const cue = filmCue(beat);
  if (!cue || REVIEW) return;
  const v = filmVideo(cue.clip), box = $('film');
  films.timers.push(setTimeout(() => {
    try { v.currentTime = cue.from || 0; } catch (e) { /* not loaded yet: start from the top */ }
    v.play().then(() => {
      for (const o of Object.values(films.videos)) o.classList.toggle('cur', o === v);
      box.classList.add('on'); films.on = true; cctv.t0 = 0;
      if (cue.card) showFilmCard(beat);
      flash(0.6);
      films.timers.push(setTimeout(() => stopFilm(true), (cue.len || 2.4) * 1000));

  }, (cue.at || 0) * 1000));
}
function stopFilm(snap) {

  }

$('film').addEventListener('pointerdown', (e) => { e.stopPropagation(); stopFilm(true); });

// Some beats move on by themselves (Paul: no tap between Smokehouse's first two lines, and none after

// pause. The line's length comes from its decoded voice; without one a typical length stands in.

  if (!beat.auto) return;
  const start = performance.now(), cue = filmCue(beat.b);
  const filmEnd = cue ? (cue.at || 0) + (cue.len || 2.4) : 0;
  const set = (voiceEnd) => { if (journey.step === i && journey.phase === 'space') journey.autoAt = start + (Math.max(voiceEnd, filmEnd) + beat.auto) * 1000; };
  set(4);
  sound.voiceBuffer(beat.b).then((buf) => { if (buf) set((buf.speechEnd || buf.duration) + (sound.voiceIndex?.[beat.b]?.radio ? 0.16 : 0)); }).catch(() => {});
}

function showStep(i, keepCard = false) {
  journey.step = i;
  const beat = BEATS[STEPS[i].beat];
  state.beat = STEPS[i].beat;
  setCard(STEPS[i].beat, keepCard);
  $('sr').textContent = bubbleById[beat.b].text;
  if (beat.fx === 'static') { sound.staticBurst(beat.cut ? beat.cut + 1.2 : undefined); flash(0.5); worlds.jitter = 1; if (navigator.vibrate) navigator.vibrate([30, 40, 30]); }

  playFilm(beat.b);
  musicBeat(beat.b);

  // from the start (Paul); after that only the hold, a gesture nobody would guess, is named, and
  // a card left waiting 10 s pulses once instead
  if (beat.hold) { setHint('Press and hold to unlock'); padShow(beat.b); }
  else if (i === 0) setHint(`${tapWord} to continue`, true);

  look.yaw = 0; look.pitch = 0; look.vyaw = 0; look.vpitch = 0;

// the card lying on the page over its own drawn box (the start of the enter zoom, a hop's two ends)
function layCard(P) {

function toPage(beatId) {

  state.stage = 'enter';                          // first: useWorld shows the drawn void in the void stage
  useWorld(false);
  camera.quaternion.copy(IDENTITY_Q); camera.position.copy(A.to); camera.fov = A.fov; camera.updateProjectionMatrix();
  pageMesh.visible = true; pageMat.uniforms.uOpacity.value = 0;

// Hops (Paul, 24 October: the zoom into the narrator panel "is great. Can we use in other places as
// transition to orientate user to position on page?"): moving to another space, the space collapses
// behind the card, the camera pulls back from it onto the page, travels across to the next box and
// zooms into it like the enter zoom, and the next space switches in behind

  const hv = Math.max(PH * 0.2, 1.5 * Math.max(Math.abs(A.c.y - m.y) + Math.max(A.bh, B.bh) / 2, (Math.abs(A.c.x - m.x) + Math.max(A.bw, B.bw) / 2) / camera.aspect));

  camera.position.set(0, 0, 0).addScaledVector(H.A.to, r * r).addScaledVector(H.C, 2 * r * e).addScaledVector(H.B.to, e * e);
  camera.fov = lerp(H.A.fov, H.B.fov, e) + (PAGE_FOV - lerp(H.A.fov, H.B.fov, e)) * Math.sin(Math.PI * e);
  camera.updateProjectionMatrix();

// whole page, then the page breaks apart and the camera dives through the drawn singularity (the
// classic breach), so the reader sees where the story has taken them
const PULL_DUR = 2.2;

  journey.phase = 'pull'; journey.t = 0;

}

// animation"): the static runs on while the next world loads, the old one shearing, then a hard cut
function cutTo(i) {

function startJourney() {

  setHint(`${tapWord} to enter`);
  loadWorld(STEPS[0].world).catch((e) => console.warn('world unavailable', e));
}

function enterSpace() {

  journey.phase = 'enter'; journey.t = 0;
  state.stage = 'enter';
  state.camStart = camera.position.clone();
  setHint('');
  // the narrator's caption becomes the first card (Paul: "zoom seamlessly into the narrator panel
  // with no cuts, background switches in seamlessly behind"): the card starts on the page over the
  // drawn box, and the camera zooms until the box sits exactly where the card rests, while the page
  // fades to dark around it and the lens eases to the spaces' field of view; then the first space
  // unwinds out of its core behind it
  setCard(STEPS[0].beat, true);

  sound.blip();
  if (sound.ok) { sound.cabin.gain.setTargetAtTime(0.25, sound.now(), 0.8); sound.startSpace(); }

  const i = journey.step, beat = BEATS[STEPS[i].beat];

  if (beat.trigger) { finalBreach(); return; }
  const next = STEPS[i + 1];

  if (beat.cut) { cutTo(i + 1); return; }
  if (reducedMotion) { leave(next.world, () => arrive(i + 1)); return; }
  leave(null, () => startHop(i + 1), OUT_DUR, true);
}

// collapse the current space into its core, then load and unwind the next (or, without a next
// world, go on to then: a hop or the pull back to the page, which load the world themselves).
// keepCard: the card stays up while the space collapses behind it, to be carried onto the page.
function leave(nextWorld, then, dur = OUT_DUR, keepCard = false) {
  journey.autoAt = null;
  padHide();
  journey.phase = 'out'; journey.t = 0; journey.outDur = dur; journey.then = then; journey.nextWorld = nextWorld;
  sound.stopVoice();
  stopFilm(false);
  if (!keepCard) cardState.target = 0;
  setHint('');
  worlds.suctionTarget = 1; worlds.suctionRate = 1 / dur;
}

function finalBreach() {
  if (journey.phase !== 'space') return;
  $('sr').textContent = 'Initiating QNTM CTRL. The space breaks apart and you fall through the singularity.';
  if (!reducedMotion) { leave(null, startPull, OUT_DUR, true); return; }
  sound.breach(FINAL_DUR);
  if (navigator.vibrate) navigator.vibrate([20, 60, 20, 60, 120]);
  leave(FINAL_WORLD, () => {
    journey.phase = 'end'; journey.done = true;
    enterVoid();
    useWorld(true);
    worlds.suction = 1; worlds.suctionTarget = 0; worlds.suctionRate = reducedMotion ? 10 : 0.3;

    if (u >= 1) {

      journey.entered = true;
      journey.phase = 'load';

    }

let down = null;

}

    flash(0.7);
    if (navigator.vibrate) navigator.vibrate(40);
    if (journey.on) { const i = journey.step; journey.phase = 'space'; showStep(i + 1); } else showBeat(state.beat + 1);
  }
}
const canvas = renderer.domElement;
canvas.addEventListener('pointerdown', (e) => {
  down = { x: e.clientX, y: e.clientY, t: performance.now() };
  if (state.stage === 'read' && !journey.on && BEATS[state.beat].hold) startHold(e.clientX, e.clientY);
  if (journey.on && journey.phase === 'space' && BEATS[state.beat].hold) startHold(e.clientX, e.clientY);
  if (state.stage === 'void') { look.dragging = true; look.lastX = e.clientX; look.lastY = e.clientY; canvas.setPointerCapture(e.pointerId); }
});
canvas.addEventListener('pointermove', (e) => {
  if (state.stage === 'read' || state.stage === 'gate' || (state.stage === 'void' && !look.dragging && e.pointerType === 'mouse')) {
    parallax.tx = (e.clientX / innerWidth - 0.5) * 2; parallax.ty = (e.clientY / innerHeight - 0.5) * 2;
  }
  if (state.holding) { ring.style.left = e.clientX + 'px'; ring.style.top = e.clientY + 'px'; state.holdX = e.clientX; state.holdY = e.clientY; }
  if (state.stage === 'void' && look.dragging) {
    const dx = e.clientX - look.lastX, dy = e.clientY - look.lastY;
    look.lastX = e.clientX; look.lastY = e.clientY;
    look.vyaw = -dx * 0.0042; look.vpitch = -dy * 0.0042;
    if (worlds.ok) {
      const L = worlds.limits, over = (v, a, b) => (v < a ? a - v : v > b ? v - b : 0);
      look.vyaw *= 1 / (1 + 6 * over(look.yaw + look.vyaw, L.yaw[0], L.yaw[1]));
      look.vpitch *= 1 / (1 + 6 * over(look.pitch + look.vpitch, L.pitch[0], L.pitch[1]));
    }
    look.yaw += look.vyaw; look.pitch = clamp(look.pitch + look.vpitch, -1.3, 1.3); look.idle = 0;
  }
});
function pointerEnd(e) {
  if (state.holding) endHold(false);
  if (state.stage === 'void' && !journey.on) { look.dragging = false; return; }
  look.dragging = false;
  if (!down) return;
  const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y), dt = performance.now() - down.t;
  down = null;
  if (moved > 14 || dt > 600) return;
  if (journey.on) {
    // a tap, not a drag: move the journey on
    if (journey.phase === 'idle' && state.stage === 'read') { enterSpace(); return; }
    if (journey.phase === 'space') {
      const beat = BEATS[state.beat];
      if (beat.trigger) { if (hitCard(e.clientX, e.clientY)) finalBreach(); else nudge(); return; }
      journeyNext();
    }
    return;
  }
  if (state.stage !== 'read') return;
  const beat = BEATS[state.beat];
  if (beat.trigger) { if (hitBubble(bubbleById.qntm, e.clientX, e.clientY)) breach(); else nudge(); return; }
  advance();
}
canvas.addEventListener('pointerup', pointerEnd);
canvas.addEventListener('pointercancel', () => { if (state.holding) endHold(false); look.dragging = false; down = null; });
let wheelLock = 0;
addEventListener('wheel', (e) => { if (state.stage === 'read' && !journey.on && Math.abs(e.deltaY) > 20 && performance.now() > wheelLock) { wheelLock = performance.now() + 650; advance(); } }, { passive: true });
let keyHold = false;
let lastInput = 0;   // the last touch, click or key, for the idle pulse
addEventListener('pointerdown', () => { lastInput = performance.now(); }, { capture: true });
addEventListener('keydown', () => { lastInput = performance.now(); }, { capture: true });
addEventListener('keydown', (e) => {
  // a key during a film cuts it short and does nothing else
  if (films.on) { e.preventDefault(); if (!e.repeat) stopFilm(true); return; }
  if (journey.on) {
    if (!(e.key === ' ' || e.key === 'Enter' || e.key === 'ArrowRight' || e.key === 'ArrowDown')) return;
    e.preventDefault();
    if (journey.phase === 'idle' && state.stage === 'read') { enterSpace(); return; }
    if (journey.phase !== 'space') return;
    const beat = BEATS[state.beat];
    if (beat.hold) { if (!keyHold && !e.repeat) { keyHold = true; startHold(innerWidth / 2, innerHeight / 2); } return; }
    if (beat.trigger) { if (e.key === 'Enter' || e.key === ' ') finalBreach(); return; }
    if (!e.repeat) journeyNext();
    return;
  }
  if (state.stage !== 'read') return;
  const beat = BEATS[state.beat];
  if (e.key === ' ' || e.key === 'Enter' || e.key === 'ArrowRight' || e.key === 'ArrowDown') {
    e.preventDefault();
    if (beat.hold) { if (!keyHold && !e.repeat) { keyHold = true; startHold(innerWidth / 2, innerHeight / 2); } return; }
    if (beat.trigger) { if (e.key === 'Enter' || e.key === ' ') breach(); return; }
    if (!e.repeat) advance();
  }
});
addEventListener('keyup', (e) => { if (keyHold && (e.key === ' ' || e.key === 'Enter' || e.key === 'ArrowRight' || e.key === 'ArrowDown')) { keyHold = false; endHold(false); } });

function onOrient(e) {
  if (e.beta == null) return;
  if (!parallax.g0) parallax.g0 = { b: e.beta, g: e.gamma };
  parallax.gx = clamp((e.gamma - parallax.g0.g) / 18, -1, 1);
  parallax.gy = clamp((e.beta - parallax.g0.b) / 18, -1, 1);
}

$('start').addEventListener('click', async () => {
  sound.start();
  if (music.index?.tracks?.length && !REVIEW) $('music').hidden = false;
  primeFilms();
  try {
    if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
      const r = await DeviceOrientationEvent.requestPermission();
      if (r === 'granted') addEventListener('deviceorientation', onOrient);
    } else addEventListener('deviceorientation', onOrient);
  } catch (e) { /* tilt stays off, pointer still works */ }
  $('gate').classList.add('hide');
  if (REVIEW) { startReview(); return; }
  if (journey.on) { startJourney(); return; }
  state.stage = 'read';
  showBeat(0);
  loadWorld(STORY_WORLD).catch((e) => console.warn('world unavailable, using the drawn void', e));
});

// ?world=<id>: go straight into a world, with buttons to switch worlds and compare the grade
async function startReview() {
  state.stage = 'void'; state.endT = 0;
  enterVoid();
  if (sound.ok) { sound.cabin.gain.setTargetAtTime(0, sound.now(), 0.4); sound.hiss.gain.setTargetAtTime(0, sound.now(), 0.4); sound.startSpace(); }
  const panel = $('review');
  panel.hidden = false;
  const show = async (id) => {
    panel.querySelectorAll('[data-world]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.world === id)));
    setHint('Loading ' + id);
    try {
      await loadWorld(id); useWorld(true); look.yaw = 0; look.pitch = 0; worlds.drift.set(0, 0, 0);
      worlds.suction = 0; setHint('Drag to look around');
      history.replaceState(null, '', '?world=' + id);
    } catch (e) { setHint('Could not load ' + id); console.error(e); }
  };
  try { await loadWorld(REVIEW === '1' ? STORY_WORLD : REVIEW); } catch (e) { console.error(e); }
  for (const w of worlds.list) {
    const b = document.createElement('button');
    b.className = 'ui-btn'; b.type = 'button'; b.textContent = w.title; b.dataset.world = w.id;
    b.addEventListener('click', () => show(w.id));
    panel.append(b);
  }
  const g = document.createElement('button');
  g.className = 'ui-btn'; g.type = 'button'; g.textContent = 'Ink grade'; g.setAttribute('aria-pressed', 'true');
  g.addEventListener('click', () => {
    const on = worlds.u.grade.value < 0.5; worlds.u.grade.value = on ? 1 : 0; g.setAttribute('aria-pressed', String(on)); for (const m of worldMeshes()) m.updateVersion();
  });
  panel.append(g);
  const x = document.createElement('button');
  x.className = 'ui-btn'; x.type = 'button'; x.textContent = 'Extrude'; x.setAttribute('aria-pressed', String(worlds.extrudeOn));
  x.addEventListener('click', () => {
    worlds.extrudeOn = !worlds.extrudeOn; x.setAttribute('aria-pressed', String(worlds.extrudeOn));
    if (!worlds.relief) worlds.u.extrude.value = worlds.extrudeOn ? 1 : 0;
    for (const m of worldMeshes()) m.updateVersion();
  });
  panel.append(x);
  const sb = document.createElement('button');
  sb.className = 'ui-btn'; sb.type = 'button'; sb.textContent = 'Sand'; sb.setAttribute('aria-pressed', String(worlds.sandOn));
  sb.addEventListener('click', () => {
    worlds.sandOn = !worlds.sandOn; sb.setAttribute('aria-pressed', String(worlds.sandOn));
    worlds.u.sand.value = worlds.sandOn && !reducedMotion ? (worlds.relief ? RELIEF_SAND : 1) : 0;
    worlds.sandMesh?.updateVersion();
  });
  panel.append(sb);
  const shb = document.createElement('button');
  shb.className = 'ui-btn'; shb.type = 'button'; shb.textContent = 'Shards'; shb.setAttribute('aria-pressed', String(shards.on));
  shb.addEventListener('click', () => { shards.on = !shards.on; shb.setAttribute('aria-pressed', String(shards.on)); });
  panel.append(shb);
  const nb = document.createElement('button');
  nb.className = 'ui-btn'; nb.type = 'button'; nb.textContent = 'Nucleus'; nb.setAttribute('aria-pressed', String(nucleus.on));
  nb.addEventListener('click', () => { nucleus.on = !nucleus.on; nb.setAttribute('aria-pressed', String(nucleus.on)); });
  panel.append(nb);
  const rb = document.createElement('button');
  rb.className = 'ui-btn'; rb.type = 'button'; rb.textContent = 'Ribbons'; rb.setAttribute('aria-pressed', String(ribbons.on));
  rb.addEventListener('click', () => { ribbons.on = !ribbons.on; ribbons.t0 = null; rb.setAttribute('aria-pressed', String(ribbons.on)); });
  panel.append(rb);
  const slb = document.createElement('button');
  slb.className = 'ui-btn'; slb.type = 'button'; slb.textContent = 'Slab'; slb.setAttribute('aria-pressed', String(slab.on));
  slb.addEventListener('click', () => {
    slab.on = !slab.on; slb.setAttribute('aria-pressed', String(slab.on));
    worlds.u.cut.value = worlds.id === STORY_WORLD && slab.on ? 1 : 0;
    for (const m of worldMeshes()) m.updateVersion();
  });
  panel.append(slb);
  show(worlds.id || STORY_WORLD);
}
if (REVIEW) $('note').textContent = 'Review mode: opens the Marble worlds directly.';
$('mute').addEventListener('click', () => { const m = !sound.muted; sound.setMuted(m); $('mute').textContent = m ? 'Sound off' : 'Sound on'; $('mute').setAttribute('aria-pressed', String(m)); });
$('again').addEventListener('click', () => location.reload());

/* ---------- loop ---------- */
const clock = new THREE.Clock();
const tmpV = new THREE.Vector3();
function frame() {
  const rawDt = Math.min(clock.getDelta(), 0.25);
  const dt = Math.min(rawDt, 0.05);
  const t = (shared.uTime.value += dt);
  shared.uFlash.value = Math.max(0, shared.uFlash.value - dt * 2.2);

  if (state.stage === 'gate' || state.stage === 'read') {
    const amp = reducedMotion ? 0 : 1;
    const px = clamp(parallax.tx + parallax.gx, -1.2, 1.2) * amp, py = clamp(parallax.ty + parallax.gy, -1.2, 1.2) * amp;
    parallax.x = lerp(parallax.x, px, 1 - Math.exp(-dt * 4));
    parallax.y = lerp(parallax.y, py, 1 - Math.exp(-dt * 4));
    const breathe = reducedMotion ? 0 : Math.sin(t * 0.4) * 0.02;
    // Paul asked for more movement here (24 October): the camera travels about twice as far
    camera.position.set(parallax.x * 0.6, -parallax.y * 0.6, fitDist * (1 + breathe * 0.2));
    camera.lookAt(lookTarget);
    const agitTarget = state.stage === 'read' && !journey.on ? smooth(0, BEATS.length - 1, Math.max(0, state.beat)) : journey.on ? 0.25 : 0;
    shared.uAgit.value = lerp(shared.uAgit.value, agitTarget, 1 - Math.exp(-dt * 1.5));
    const panelGlow = journey.on && state.stage === 'read' && journey.phase === 'idle' ? 0.6 + 0.4 * Math.sin(t * 2.2) : 0;
    pageMat.uniforms.uPanelGlow.value = lerp(pageMat.uniforms.uPanelGlow.value, panelGlow, 1 - Math.exp(-dt * 3));
  }

  // bubble lift and flicker
  bubbles.forEach((b) => {
    if (b.id === 'tbc' && state.stage !== 'read') return;
    // a sprung jump towards the reader: quick, with a small overshoot and settle
    b.vel += ((b.target - b.lift) * 95 - b.vel * 12) * dt;
    b.lift += b.vel * dt;
    if (b.target === 0 && b.lift < 0.002 && Math.abs(b.vel) < 0.01) { b.lift = 0; b.vel = 0; }
    lifts[b.i] = clamp(b.lift, 0, 1);
    b.flickT = Math.max(0, b.flickT - dt);
    b.mesh.visible = b.lift > 0.001 && (state.stage === 'read' || state.stage === 'breach');
    // comes well forward and grows, but stays over its place on the page, so boxes near the edge stay on screen
    const rise = Math.max(0, b.lift) * (reducedMotion ? 0.12 : 1.6);
    const keep = (fitDist - bubbleZ - rise) / (fitDist - bubbleZ);
    const cx = state.stage === 'read' ? camera.position.x : 0, cy = state.stage === 'read' ? camera.position.y : 0;
    b.mesh.position.set(b.base.x * keep + cx * (1 - keep), b.base.y * keep + cy * (1 - keep), bubbleZ + rise);
    b.mesh.scale.setScalar(1 + Math.max(0, b.lift) * (reducedMotion ? 0.04 : 0.12));
    b.mesh.rotation.z = reducedMotion ? 0 : b.lift * b.tilt;
    b.mat.uniforms.uFlick.value = b.flickT > 0 ? 1 : 0;
    const isTrigger = state.stage === 'read' && BEATS[state.beat]?.trigger && b.id === 'qntm';
    b.mat.uniforms.uGlow.value = isTrigger ? 0.35 + 0.35 * Math.sin(t * 5) : 0;
  });

  // hold to unlock
  if (state.holding) {
    state.holdT += rawDt;
    const p = clamp(state.holdT / HOLD_DUR, 0, 1);
    ringProg.style.strokeDashoffset = 251.3 * (1 - p);
    // power up: the ring swells and brightens, grains fly out of the press faster and further,
    // and the world's signal starts to break up
    ring.style.transform = `scale(${1 + 0.45 * p})`;
    ring.style.setProperty('--p', p.toFixed(3));
    fx.acc += rawDt * (reducedMotion ? 25 : 70 + 520 * p * p);
    const n = Math.floor(fx.acc); fx.acc -= n;
    fxEmit(n, state.holdX, state.holdY, 120 + 640 * p);
    if (!reducedMotion && journey.on) worlds.jitter = Math.max(worlds.jitter, 0.4 * p * p);
    if (p >= 1) endHold(true);
  }
  fxUpdate(dt);

  // breach
  if (state.stage === 'breach') {
    if (!state.freeze) state.breachT += rawDt;
    const u = clamp(state.breachT / BREACH_DUR, 0, 1);
    if (!reducedMotion) {
      pageMat.uniforms.uOpacity.value = 1 - smooth(0.0, 0.05, u);
      pageMesh.visible = pageMat.uniforms.uOpacity.value > 0.01;
      ptsMat.uniforms.uT.value = smooth(0.0, 0.5, u) * 1.3;
      bubbles.forEach((b) => (b.mat.uniforms.uOpacity.value = 1 - smooth(0.05, 0.25, u)));
      shared.uAgit.value = 1 - smooth(0.0, 0.3, u);
      const zc = u < 0.42 ? lerp(state.camStart.z, 0.15, ease(u / 0.42)) : lerp(0.15, VOID_Z, ease((u - 0.42) / 0.58));
      camera.position.set(lerp(state.camStart.x, CX, smooth(0, 0.3, u)), lerp(state.camStart.y, CY, smooth(0, 0.3, u)), zc);
      tmpV.set(CX, CY, -100);
      const lt = tmpV.clone().lerp(state.lookStart, 1 - smooth(0, 0.35, u));
      camera.lookAt(lt);
      camera.rotateZ(Math.sin(u * Math.PI) * 0.5);
      camera.fov = lerp(40 + smooth(0.3, 0.65, u) * 34, voidFov(), smooth(0.8, 1, u));
      camera.updateProjectionMatrix();
      const sc = renderer.domElement.height / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)));
      ptsMat.uniforms.uScale.value = sc;
      voidU.uFog.value = lerp(0.6, 0.034, smooth(0.1, 0.75, u));
      worlds.suction = 1 - 0.6 * smooth(0.5, 1, u);
      if (worlds.ok && u > 0.72 && voidGroup.visible) useWorld(true);
      if (u > 0.7 && u < 0.73) flash(0.35);
    }
    if (state.breachT >= BREACH_DUR) enterVoid();
  }

  // void free look
  if (state.stage === 'void') {
    state.endT += rawDt;
    // wall clock, like the other story timers, so a slow device still settles
    const sRate = reducedMotion ? 10 : worlds.suctionRate;
    worlds.suction += clamp(worlds.suctionTarget - worlds.suction, -sRate * rawDt, sRate * rawDt);
    const lim = worlds.ok ? worlds.limits : { yaw: [-Infinity, Infinity], pitch: [-1.3, 1.3] };
    if (!look.dragging) {
      look.vyaw *= Math.exp(-dt * 3); look.vpitch *= Math.exp(-dt * 3);
      look.yaw += look.vyaw; look.pitch += look.vpitch;
      look.idle += dt;
      if (look.idle > 4 && !reducedMotion) {
        // drift slowly; inside a world, sweep back and forth within what Marble made
        if (worlds.ok) look.yaw += Math.sin(state.endT * 0.05) * dt * 0.05;
        else look.yaw += dt * 0.04;
      }
      // ease back inside the limits rather than stopping dead
      look.yaw += (clamp(look.yaw, lim.yaw[0], lim.yaw[1]) - look.yaw) * (1 - Math.exp(-dt * 4));
      look.pitch += (clamp(look.pitch, lim.pitch[0], lim.pitch[1]) - look.pitch) * (1 - Math.exp(-dt * 4));
    }
    look.pitch = clamp(look.pitch, -1.3, 1.3);
    const gy = reducedMotion ? 0 : parallax.gx * 0.6, gp = reducedMotion ? 0 : -parallax.gy * 0.4;
    camera.rotation.set(look.pitch + gp, look.yaw - gy, 0);
    const fwd = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
    if (worlds.ok) {
      // a world only holds together near its viewpoint, so the drift stays within a small radius
      if (!reducedMotion && worlds.relief) worlds.drift.addScaledVector(fwd, dt * 0.02).clampLength(0, WORLD_SCALE * 0.08);
      // a Marble world is a shell around its viewpoint, so a still camera sees a flat panorama;
      // a slow wander through the middle of it is what shows its depth
      if (!worlds.relief && !reducedMotion) {
        const T = worlds.wanderT ?? state.endT, R = worlds.radius * WORLD_SCALE;
        // forward travel is shorter when extruded, so the camera stays clear of splats pulled towards it
        const ex = worlds.u.extrude.value > 0, side = ex ? 0.09 : 0.16, fwdMax = ex ? 0.12 : 0.24;
        worlds.wander.set(side * Math.sin(T * 0.13), 0.04 * Math.sin(T * 0.09 + 1), -fwdMax * (0.5 - 0.5 * Math.cos(T * 0.07))).multiplyScalar(R);
      } else worlds.wander.set(0, 0, 0);
      // the pointer (or tilt) slides the viewpoint a little more
      const px = reducedMotion ? 0 : clamp(parallax.tx + parallax.gx, -1.2, 1.2), py = reducedMotion ? 0 : clamp(parallax.ty + parallax.gy, -1.2, 1.2);
      worlds.offset.lerp(tmpV.set(px, -py, 0).multiplyScalar(worlds.parallax).applyQuaternion(camera.quaternion), 1 - Math.exp(-dt * 4));
      camera.position.copy(P0).add(worlds.drift).add(worlds.wander).add(worlds.offset);
    } else if (!reducedMotion) camera.position.addScaledVector(fwd, dt * 0.25);
    // To be continued... comes 8 s into the ending (Paul: five seconds later than it was)
    if (state.endT > 8 && !tbcCard.visible && !REVIEW && (!journey.on || journey.done)) {
      tbcCard.visible = true;
      sound.playVoice('tbc');
      musicBeat('tbc');
      const gp = tbc.mesh.geometry.parameters, visW = 2 * 2.4 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * camera.aspect;
      const s = Math.min(0.34 / gp.height, (visW * 0.78) / gp.width);
      tbcCard.scale.setScalar(s);
      tbcCard.position.set(0, -0.62, -2.4);
    }
    if (tbcCard.visible) {
      tbcCard.material.uniforms.uOpacity.value = smooth(3, 4.5, state.endT);
      tbcCard.material.uniforms.uFlick.value = state.endT < 3.6 ? 1 : 0;
    }
    if (state.endT > 10 && !REVIEW && (!journey.on || journey.done)) $('again').classList.add('show');
    if (state.endT > 6 && look.idle < 1 && (!journey.on || journey.done)) setHint('');
  }

  spinners.forEach((s) => { s.o.rotation.y += s.s * dt; s.o.rotation.x += s.s * 0.5 * dt; });
  sing.material.rotation += dt * 0.03;
  sing.scale.setScalar(46 + Math.sin(t * 0.7) * 2);
  updateJourney(rawDt, dt);
  updateWorld(rawDt, t);
  updateShards(dt);
  updateNucleus(dt);
  updateSlab(dt, rawDt);
  updatePanelFloat(dt);
  if (films.on) drawCCTV(rawDt);
  if (pad.on) drawPad(rawDt);
  updateRibbons(dt, rawDt);
  if (sound.ok && music.index) musicLoop(state.stage === 'void' && worlds.ok ? worlds.id : state.stage === 'read' ? 'page' : music.loopKey);
  sound.update(dt, camera);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

Promise.all([loadTex(PAGE_SRC, true), loadTex(DEPTH_SRC, false)]).then(([page, depth]) => {
  depth.generateMipmaps = false; depth.minFilter = THREE.LinearFilter; depth.anisotropy = 1;
  shared.uPage.value = page; shared.uDepth.value = depth;
  resize();
  // the OT logo holds for at least 1.8 s from the page opening, then cuts away to the start
  setTimeout(() => $('intro').classList.add('out'), Math.max(0, 1800 - (performance.now() - (window.__introT0 || 0))));
  window.__ot = { state, breach, showBeat, BEATS, camera, worlds, look, parallax, journey, STEPS, journeyNext, finalBreach, enterSpace, showStep, sound, films, playFilm, stopFilm, shards, nucleus, ribbons, slab, panelFloat, music, musicBeat, pad };
  requestAnimationFrame(frame);
}).catch((e) => { $('note').innerHTML = '<span class="err">The page artwork failed to load.</span>'; console.error(e); });
</script>
