<style>
  :root {
    --ink: #060504;
    --paper: #efe9df;
    --sepia: #8a6a4a;
    --dim: rgba(239, 233, 223, 0.62);
    --bg: #060504;
  }
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--paper); overflow: hidden; }
  body { font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace; -webkit-tap-highlight-color: transparent; touch-action: none; user-select: none; -webkit-user-select: none; }
  canvas { display: block; position: fixed; inset: 0; width: 100%; height: 100%; }
  /* strobe inversions in the singularity: a white layer that subtracts, so the 3D view below turns negative */
  #invert { position: fixed; inset: 0; pointer-events: none; background: #fff; mix-blend-mode: difference; opacity: 0; }
  .vignette { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,0.55) 100%); }
  .grain { position: fixed; inset: -50%; pointer-events: none; opacity: 0.09; mix-blend-mode: screen; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); animation: grain 0.6s steps(4) infinite; }
  @keyframes grain { 0%{transform:translate(0,0)} 25%{transform:translate(-3%,2%)} 50%{transform:translate(2%,-3%)} 75%{transform:translate(-2%,-1%)} 100%{transform:translate(0,0)} }
  .flash { position: fixed; inset: 0; z-index: 3; pointer-events: none; background: var(--paper); opacity: 0; mix-blend-mode: overlay; }
  /* a short film of Bob that cuts in full screen as he speaks (assets/films) */
  /* over the touch pad (Paul: the Holy smokes panel comes up over the bio scanner as it fades) */
  #film { position: fixed; inset: 0; z-index: 3; background: #000; opacity: 0; pointer-events: none; }
  #film.on { opacity: 1; pointer-events: auto; animation: filmIn 0.16s steps(3, end); }
  #film video { display: none; width: 100%; height: 100%; object-fit: cover; filter: grayscale(1) contrast(1.08); }
  /* the films are portrait: on a wide screen show the whole frame with ink either side */
  @media (min-aspect-ratio: 4/5) { #film video { object-fit: contain; } #film video.land { object-fit: cover; } }
  #film video.cur { display: block; }
  /* over the films (Paul): a super fine scan line, a slow rolling band, and an alien CCTV readout */
  #film::after { content: ''; position: absolute; inset: 0; pointer-events: none; background:
    repeating-linear-gradient(0deg, rgba(0,0,0,0.34) 0 1px, rgba(0,0,0,0) 1px 2px),
    linear-gradient(180deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.05) 48%, rgba(255,255,255,0) 52%);
    background-size: 100% 2px, 100% 300%; animation: scanRoll 6s linear infinite; }
  @keyframes scanRoll { from { background-position: 0 0, 0 0%; } to { background-position: 0 0, 0 -300%; } }
  /* the biometric touch screen for the hold: a looping top-down film of an alien touch pad, a code
     layer drawn where the thumb is, and the line's lettering */
  /* the pad floats over Bob's space (Paul: "add Gaussian splatter behind touchscreen"): the world shows
     round it through a dark veil, and the film's edges feather into it */
  #pad { position: fixed; inset: 0; z-index: 2; display: grid; place-items: center; background: rgba(5,4,3,0.45); opacity: 0; pointer-events: none; transition: opacity 0.45s; touch-action: none; }
  #pad.on { opacity: 1; pointer-events: auto; }
  /* a long press must reach the pad, not the video: on a video Android Chrome opens its own menu
     (download, picture in picture) and cancels the hold */
  #pad video, #film video { pointer-events: none; -webkit-touch-callout: none; }
  #pad, #film { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
  #pad video { display: block; width: min(90vw, 82vh * 0.5625); aspect-ratio: 9 / 16; height: auto; object-fit: cover; filter: grayscale(1) contrast(1.05) drop-shadow(0 0 30px rgba(0,0,0,0.9));
    -webkit-mask-image: radial-gradient(ellipse 60% 56% at 50% 50%, #000 78%, transparent 100%); mask-image: radial-gradient(ellipse 60% 56% at 50% 50%, #000 78%, transparent 100%);
    animation: padFloat 6s ease-in-out infinite; }
  @keyframes padFloat { 0%, 100% { transform: translateY(-0.6%) rotate(-0.4deg); } 50% { transform: translateY(0.6%) rotate(0.4deg); } }
  @media (prefers-reduced-motion: reduce) { #pad video { animation: none; } }
  #pad::after { content: ''; position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(0deg, rgba(0,0,0,0.3) 0 1px, rgba(0,0,0,0) 1px 2px); }
  #padUI { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  body.padOn #ring { display: none; }
  #cctv { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  /* the Super 8 pass draws the film over its video (the video stays underneath, playing, as some phones stop
     decoding a hidden one); without WebGL it stays hidden and the plain video shows */
  #s8 { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; display: none; background: #000; }
  #s8.on { display: block; }
  #filmCard, #padCard { position: absolute; top: auto; right: auto; left: 50%; bottom: 13%; transform: translateX(-50%); width: min(86vw, 26vh * var(--aw, 3)); height: auto; pointer-events: none; display: none; }
  #filmCard.show, #padCard.show { display: block; animation: filmCardIn 0.45s cubic-bezier(.2,1.6,.4,1) both; }
  #padCard.show.out { animation: padCardOut 0.35s ease-in both; }
  @keyframes padCardOut { 0% { opacity: 1; transform: translateX(-50%); } 100% { opacity: 0; transform: translateX(-50%) translateY(10px) scale(0.94); } }
  @keyframes filmCardIn { 0% { opacity: 0; transform: translateX(-50%) translateY(16px) scale(0.86); filter: brightness(1.8); } 40% { opacity: 1; } 100% { transform: translateX(-50%); filter: none; } }
  @keyframes filmIn { 0% { transform: translateX(-3%) scaleY(1.04); filter: brightness(2.2); } 60% { transform: translateX(1.5%); } 100% { transform: none; filter: none; } }
  /* the OT logo, white out of black (Paul), flashes up first: a couple of glitched frames (one inverted), a hold, then it cuts away */
  #intro { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; background: #050403; color: #efe9df; animation: introIn 0.9s linear both; }
  #intro svg { width: min(78vw, 66vh); height: auto; }
  /* scan lines and a slow rolling band over the logo, as over the films */
  #intro::after { content: ''; position: absolute; inset: 0; pointer-events: none; background:
    repeating-linear-gradient(0deg, rgba(0,0,0,0.42) 0 1px, rgba(0,0,0,0) 1px 3px),
    linear-gradient(180deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.06) 48%, rgba(255,255,255,0) 52%);
    background-size: 100% 3px, 100% 300%; animation: scanRoll 5s linear infinite; }
  /* it glitches out (Paul): sheared slices, an inverted frame, then a collapse to a bright line like a set switching off */
  #intro.out { animation: introOut 0.75s steps(1, end) forwards; pointer-events: none; }
  #intro.out svg { animation: introSlice 0.75s steps(1, end) forwards; }
  @keyframes introIn { 0% { opacity: 0; } 5% { opacity: 1; filter: invert(1); } 10% { opacity: 0; } 15% { opacity: 1; filter: none; transform: translateX(-2.5%) scaleY(1.03); } 19% { transform: none; } 100% { opacity: 1; } }
  @keyframes introOut { 0% { opacity: 1; } 12% { filter: invert(1); } 18% { filter: none; } 34% { filter: invert(1); } 40% { filter: none; transform: none; }
    62% { transform: scaleY(0.04); filter: brightness(3); } 74% { transform: scale(0.6, 0.006); filter: brightness(4); } 86% { transform: scale(0.02, 0.006); } 100% { opacity: 0; visibility: hidden; } }
  @keyframes introSlice { 0% { clip-path: none; transform: none; }
    6% { clip-path: polygon(0 0, 100% 0, 100% 38%, 0 38%, 0 46%, 100% 46%, 100% 100%, 0 100%); transform: translateX(-4%); }
    12% { clip-path: none; transform: translateX(3%) skewX(-6deg); }
    18% { clip-path: polygon(0 20%, 100% 20%, 100% 58%, 0 58%); transform: translateX(-7%); }
    26% { clip-path: polygon(0 0, 100% 0, 100% 64%, 0 64%, 0 71%, 100% 71%, 100% 100%, 0 100%); transform: translateX(5%) scaleY(1.06); }
    34% { clip-path: none; transform: translateX(-2%); }
    40% { transform: none; } }
  @media (prefers-reduced-motion: reduce) { #intro { animation: none; } #intro.out, #intro.out svg { animation: none; } #intro.out { opacity: 0; visibility: hidden; transition: opacity 0.4s; } }
  /* the music counter: a tab at the side, opening to the three tracks (assets/music/index.json) */
  #music[hidden] { display: none; }
  #music { position: fixed; z-index: 4; right: 14px; top: calc(max(14px, env(safe-area-inset-top)) + 46px); display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  #music .ui-btn { position: static; }
  #musicVolBox { display: flex; align-items: center; gap: 0.5rem; cursor: default; }
  #musicVol { width: 6.2rem; accent-color: var(--paper); margin: 0; }
  #musicTab.unlocked { animation: tabFlash 1.2s steps(6, end); }
  /* on an unlock the tab scrolls the track's name through itself, twice, then shows the count again */
  #musicTab.marquee { position: relative; overflow: hidden; white-space: nowrap; }
  #musicTab.marquee > :not(.mt-marquee) { visibility: hidden; }
  .mt-marquee { position: absolute; top: 50%; left: 100%; transform: translate(0, -50%); white-space: nowrap; animation: marquee var(--d, 4s) linear 2 forwards; }
  @keyframes marquee { from { left: 100%; transform: translate(0, -50%); } to { left: 0; transform: translate(-100%, -50%); } }
  @media (prefers-reduced-motion: reduce) { .mt-marquee { animation: none; left: 50%; transform: translate(-50%, -50%); } }
  @keyframes tabFlash { 0%, 33%, 66% { background: var(--paper); color: var(--ink); } 16%, 50%, 100% { background: rgba(6,5,4,0.7); color: var(--paper); } }
  #musicCount { color: var(--dim); margin-left: 0.4em; }
  /* the sound and music buttons carry an icon for phones; on bigger screens they keep their words */
  .ui-btn .ico { display: none; width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .ui-btn .ico .x { display: none; }
  #mute[aria-pressed="true"] .ico .on { display: none; }
  #mute[aria-pressed="true"] .ico .x, #musicOn[aria-pressed="false"] .ico .x { display: inline; }
  #musicList { background: rgba(6,5,4,0.86); border: 1px solid rgba(239,233,223,0.25); padding: 0.7rem 0.8rem; width: min(17rem, calc(100vw - 28px)); font-size: 0.64rem; letter-spacing: 0.12em; text-transform: uppercase; }
  #musicList .mt-head { margin: 0 0 0.6rem; color: var(--dim); line-height: 1.5; }
  #musicTracks { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.4rem; }
  #musicTracks li { display: flex; align-items: center; justify-content: space-between; gap: 0.6rem; }
  #musicTracks li.locked { color: rgba(239,233,223,0.35); }
  #musicTracks button { font: inherit; color: var(--ink); background: var(--paper); border: 0; padding: 0.3rem 0.5rem; cursor: pointer; }
  #musicTracks button:disabled { background: rgba(239,233,223,0.2); color: var(--dim); cursor: default; }
  #musicBuy[hidden] { display: none; }
  #musicBuy { display: block; margin-top: 0.7rem; color: var(--paper); }
  #toast { position: fixed; z-index: 5; left: 50%; top: calc(max(14px, env(safe-area-inset-top)) + 4px); transform: translateX(-50%); background: var(--paper); color: var(--ink); font-size: 0.66rem; letter-spacing: 0.16em; text-transform: uppercase; padding: 0.5rem 0.8rem; opacity: 0; pointer-events: none; transition: opacity 0.3s; white-space: nowrap; }
  #toast.show { opacity: 1; }
  .black { position: fixed; inset: 0; pointer-events: none; background: #000; opacity: 0; transition: opacity 0.5s; }

  #gate { position: fixed; inset: 0; display: grid; place-items: center; background: #050403; z-index: 5; transition: opacity 0.6s; padding: 16px; }
  #gate.hide { opacity: 0; pointer-events: none; }
  .gate-card { text-align: center; max-width: 22rem; }
  .gate-card h1 { font-size: 0.95rem; letter-spacing: 0.32em; font-weight: 600; margin: 0 0 0.4rem; }
  .gate-card .cat { font-size: 0.72rem; letter-spacing: 0.24em; color: var(--dim); margin: 0 0 2rem; }
  /* the Enter button (Paul: "a standard slick modern UI button, with animated rollover"): a thin paper
     outline; on hover or focus the paper fills in from the left, the text turns to ink, the arrow
     slides on and the letters open out */
  .gate-card button { position: relative; display: inline-flex; align-items: center; gap: 0.9rem; overflow: hidden; padding: 0.95rem 1.6rem 0.95rem 1.9rem;
    font: inherit; font-size: 0.8rem; font-weight: 600; letter-spacing: 0.32em; color: var(--paper); background: transparent; border: 1px solid rgba(239,233,223,0.7); border-radius: 2px; cursor: pointer;
    transition: color 0.35s cubic-bezier(.2,.8,.2,1), border-color 0.35s, letter-spacing 0.35s cubic-bezier(.2,.8,.2,1), transform 0.15s; }
  .gate-card button::before { content: ''; position: absolute; inset: 0; background: var(--paper); transform: scaleX(0); transform-origin: left; transition: transform 0.45s cubic-bezier(.2,.8,.2,1); }
  .gate-card button .lbl, .gate-card button .arr { position: relative; }
  .gate-card button .arr { width: 1.3rem; height: 0.65rem; fill: none; stroke: currentColor; stroke-width: 1.5; transition: transform 0.35s cubic-bezier(.2,.8,.2,1); }
  .gate-card button:hover, .gate-card button:focus-visible { color: var(--ink); border-color: var(--paper); letter-spacing: 0.4em; outline: none; }
  .gate-card button:hover::before, .gate-card button:focus-visible::before { transform: scaleX(1); }
  .gate-card button:hover .arr, .gate-card button:focus-visible .arr { transform: translateX(0.35rem); }
  .gate-card button:active { transform: scale(0.97); }
  /* OBTRAN003 decrypts, then the sentence and the button come in */
  .gate-card .code { margin: 0 0 1.6rem; font-size: 1.05rem; letter-spacing: 0.42em; padding-left: 0.42em; min-height: 1.4em; white-space: pre; }
  .gate-card .lead, .gate-card button { opacity: 0; pointer-events: none; }
  #gate.ready .lead { animation: gateIn 0.5s steps(5, end) both; }
  #gate.ready button { animation: gateIn 0.5s 0.35s steps(5, end) both; pointer-events: auto; }
  @keyframes gateIn { 0% { opacity: 0; } 20% { opacity: 1; } 40% { opacity: 0.2; } 60% { opacity: 1; } 100% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { #gate.ready .lead, #gate.ready button { animation: none; opacity: 1; } }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  .gate-card .lead { margin: 0 0 2rem; font-size: 0.82rem; line-height: 1.7; letter-spacing: 0.06em; }
  .gate-card .err { color: #d9a27a; }

  #hint { position: fixed; left: 50%; bottom: max(22px, env(safe-area-inset-bottom)); transform: translateX(-50%); font-size: 0.7rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--dim); background: rgba(6,5,4,0.7); padding: 0.55rem 0.9rem; z-index: 3; transition: opacity 0.4s; white-space: nowrap; pointer-events: none; }
  #hint.off { opacity: 0; }
  /* on the first scene the hint points up at the card */
  #hint.arrow::before { content: ''; position: absolute; left: 50%; bottom: 100%; width: 2px; height: 26px; margin-left: -1px; background: var(--paper); animation: hintArrow 1.4s ease-in-out infinite; }
  #hint.arrow::after { content: ''; position: absolute; left: 50%; bottom: calc(100% + 22px); width: 10px; height: 10px; margin-left: -6px; border-left: 2px solid var(--paper); border-top: 2px solid var(--paper); transform: rotate(45deg); animation: hintArrow 1.4s ease-in-out infinite; }
  @keyframes hintArrow { 0%, 100% { translate: 0 0; } 50% { translate: 0 -6px; } }
  #hint.nudge { animation: nudge 0.4s; }
  @keyframes nudge { 0%,100%{transform:translateX(-50%)} 25%{transform:translateX(calc(-50% - 6px))} 75%{transform:translateX(calc(-50% + 6px))} }

  .ui-btn { position: fixed; z-index: 4; font: inherit; font-size: 0.66rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--paper); background: rgba(6,5,4,0.7); border: 1px solid rgba(239,233,223,0.25); padding: 0.5rem 0.7rem; cursor: pointer; }
  #mute { top: max(14px, env(safe-area-inset-top)); right: 14px; }

  #review { position: fixed; left: 14px; top: max(14px, env(safe-area-inset-top)); z-index: 4; display: flex; flex-wrap: wrap; gap: 6px; max-width: calc(100% - 120px); }
  #review .ui-btn { position: static; }
  #review .ui-btn[aria-pressed="true"] { background: var(--paper); color: var(--ink); }
  @media (max-width: 600px) { #review { gap: 4px; } #review .ui-btn { font-size: 0.56rem; letter-spacing: 0.1em; padding: 0.35rem 0.45rem; } }
  #ring { position: fixed; width: 96px; height: 96px; margin: -48px 0 0 -48px; pointer-events: none; z-index: 4; opacity: 0; transition: opacity 0.2s; }
  #ring.on { opacity: 1; }
  #ring { --p: 0; transition: opacity 0.2s, transform 0.08s; filter: drop-shadow(0 0 calc(4px + 14px * var(--p)) rgba(239, 233, 223, calc(0.35 + 0.6 * var(--p)))); }
  /* the breach's glyphs (glyphVeilShow): pre-drawn scrambles cycled by CSS, so they keep moving whatever the page is doing */
  #glyphVeil { position: fixed; inset: 0; z-index: 2; pointer-events: none; visibility: hidden; opacity: 0; background: #050403; will-change: opacity; }
  #glyphVeil.on { visibility: visible; opacity: 1; }
  #glyphVeil.out { opacity: 0; transition: opacity 1.4s ease-out; }
  #glyphVeil canvas { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; will-change: opacity; animation: glyphFrame 0.3s step-end infinite; }
  @keyframes glyphFrame { 0% { opacity: 1; } 16.6667% { opacity: 0; } }
  #glyphVeil .ring { position: absolute; left: 50%; top: 50%; width: 150vmax; height: 150vmax; margin: -75vmax 0 0 -75vmax; border-radius: 50%; will-change: transform, opacity;
    background: radial-gradient(circle, rgba(239,233,223,0) 60%, rgba(239,233,223,0.28) 66%, rgba(239,233,223,0) 71%); mix-blend-mode: screen; animation: glyphRing 0.9s linear infinite; }
  @keyframes glyphRing { 0% { transform: scale(1); opacity: 1; } 85% { opacity: 1; } 100% { transform: scale(0.02); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { #glyphVeil canvas { animation: none; } #glyphVeil canvas:first-child { opacity: 1; } #glyphVeil .ring { display: none; } }
  #fx { position: fixed; inset: 0; z-index: 3; width: 100%; height: 100%; pointer-events: none; }   /* over the pad and films, as they are raised */
  #ring circle { fill: none; stroke-width: 4; }
  #ring .track { stroke: rgba(239,233,223,0.2); }
  #ring .prog { stroke: var(--paper); stroke-linecap: square; transform: rotate(-90deg); transform-origin: 50% 50%; }

  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  /* phones (Paul: the controls "are too large on a mobile phone and obscure some of the map"): one small row of
     icons at the top right, lighter, with the track list opening under it */
  @media (max-width: 600px) {
    .ui-btn { font-size: 0.52rem; letter-spacing: 0.12em; padding: 0.32rem 0.42rem; background: rgba(6,5,4,0.42); border-color: rgba(239,233,223,0.16); }
    #mute, #musicOn { padding: 0.26rem; line-height: 0; }
    #mute .lbl, #musicOn .lbl, #musicVolBox > span { display: none; }
    #mute .ico, #musicOn .ico { display: block; }
    #mute { top: max(8px, env(safe-area-inset-top)); right: 8px; }
    #music { top: max(8px, env(safe-area-inset-top)); right: 42px; flex-direction: row; align-items: center; gap: 4px; }
    #musicVolBox { padding: 0.28rem 0.4rem; height: 23px; box-sizing: border-box; }
    #musicVol { width: 3.6rem; height: 12px; }
    #musicTab { height: 23px; box-sizing: border-box; }
    #musicTab .mt-name { letter-spacing: 0.08em; }
    #musicList { position: absolute; top: calc(100% + 4px); right: 0; }
  }
</style>
</head>
<body>
<!-- the OT logo, full screen, before anything else loads (Paul, 24 October); drawn from the label's logo -->
<div id="intro"><svg viewBox="0 0 467 490" role="img" aria-label="Oblivious Transfer"><g fill="none" stroke="currentColor" stroke-width="22"><rect x="62" y="73" width="62" height="116" rx="31"/><path d="M212 131 H330 A100 100 0 0 1 430 231 V246"/><path d="M108 246 V255 A100 100 0 0 0 208 355 H296"/><path d="M330 304 H440 M385 304 V428"/></g></svg></div>
<script>window.__introT0 = performance.now(); setTimeout(() => { document.getElementById('intro')?.classList.add('out'); document.getElementById('gate')?.classList.add('ready'); }, 10000);</script>
<div id="film" aria-hidden="true"><canvas id="s8"></canvas><canvas id="cctv"></canvas><canvas id="filmCard"></canvas></div>
<div id="pad" aria-hidden="true"><video muted playsinline loop preload="auto"></video><canvas id="padUI"></canvas><canvas id="padCard"></canvas></div>
<div id="invert" aria-hidden="true"></div>
<div class="vignette"></div>
<div class="grain"></div>
<div class="flash" id="flash"></div>
<div class="black" id="black"></div>
<canvas id="fx" aria-hidden="true"></canvas>

<div id="gate" role="dialog" aria-label="Start">
  <div class="gate-card">
    <h1 class="sr-only">%%TEXT_HEADING%%</h1>
    <!-- after the logo (Paul, 24 October): OBTRAN003 decrypts like a code, then one sentence and
         the Enter button, drawn as one of the comic's black panels with its word cut from the
         comic's own lettering (tools/cut_enter_label.py) -->
    <p class="code" id="code" aria-hidden="true">%%TEXT_CODE%%</p>
    <p class="lead" id="note">%%TEXT_LEAD%%</p>
    <button id="start" type="button"><span class="lbl">ENTER</span><svg class="arr" viewBox="0 0 24 12" aria-hidden="true"><path d="M0 6h21M16 1l5 5-5 5"/></svg></button>
  </div>
</div>

<script type="importmap">{ "imports": { "three": "%%THREE_URL%%", "three/addons/": "%%THREE_ADDONS_URL%%", "@sparkjsdev/spark": "%%SPARK_URL%%" } }</script>
<script type="module">
import * as THREE from 'three';

const PAGE_SRC = '%%PAGE_SRC%%';
const DEPTH_SRC = '%%DEPTH_SRC%%';
const META = %%META%%;
// the comic's content (comics/<id>/comic.json, embedded by tools/build.mjs): beats, journey, worlds, set pieces, words
const COMIC = %%COMIC%%;
const SP = COMIC.setPieces || {};

/* ---------- constants ---------- */
const PW = 2.0;
const PH = PW * META.aspect;
const DEPTH_SCALE = 0.9;
const CX = (META.centre[0] - 0.5) * PW;
const CY = (0.5 - META.centre[1]) * PH;
const VOID_Z = -26;
const BREACH_DUR = 4.8;
const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const isTouch = matchMedia('(pointer: coarse)').matches;

const SPEAKER_GAIN = COMIC.speakerGain || {};   // per speaker, after the radio and its limiter
const HOLD_DUR = 1.4;                     // seconds of press and hold to unlock
const BEATS = COMIC.beats;                // flags: fx, cut, auto, hold, trigger, filmOnly, invert (see the comic skill)
const END_BEAT = COMIC.endBeat;            // the ending's lettering (To be continued...)
const TRIGGER_BEAT = BEATS.find((b) => b.trigger)?.b;

const $ = (id) => document.getElementById(id);

// OBTRAN003 decrypts like a code as the logo glitches out (Paul, 24 October): each character cycles
// through code glyphs and settles, left to right, then the sentence and the Enter button come in
function decryptCode() {
  const el = $('code'), gate = $('gate'), word = COMIC.text.code, glyphs = '#%&/<>=+*01ABCDEFKLMNXZ';
  if (!el || gate.classList.contains('ready')) { gate.classList.add('ready'); return; }
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) { el.textContent = word; gate.classList.add('ready'); return; }
  const t0 = performance.now() + 450, settle = (i) => 380 + i * 120;        // starts as the logo collapses
  // Paul's telemetry bleeps, cut to the decrypt's length. This is before any tap, so most phones will
  // not let it play (browsers hold sound until the first gesture); where they do, it plays in time
  const snd = new Audio('assets/sfx/decrypt.mp3'); snd.preload = 'auto'; snd.volume = 0.8;
  setTimeout(() => snd.play().catch(() => {}), 450);
  const tick = () => {
    const ms = performance.now() - t0;
    el.textContent = ms < 0 ? '' : [...word].map((c, i) => ms > settle(i) ? c : ms > i * 40 ? glyphs[Math.floor(Math.random() * glyphs.length)] : ' ').join('');
    if (ms < settle(word.length - 1)) setTimeout(tick, 45);
    else setTimeout(() => gate.classList.add('ready'), 250);
  };
  tick();
}
const hintEl = $('hint');
const tapWord = isTouch ? 'Tap' : 'Click';

function uvToWorld(u, v) { return new THREE.Vector2((u - 0.5) * PW, (0.5 - v) * PH); }
function clamp(x, a, b) { return Math.min(b, Math.max(a, x)); }
function lerp(a, b, t) { return a + (b - a) * t; }
function ease(t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }
function smooth(e0, e1, x) { const t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); }

/* ---------- renderer ---------- */
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
  if (!renderer.capabilities.isWebGL2) throw new Error('WebGL2 not available');
} catch (e) {
  $('gate').classList.add('ready'); $('note').innerHTML = '<span class="err">This browser cannot run the 3D page (WebGL2 is unavailable).</span>';
  $('start').disabled = true;
  throw e;
}
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x060504, 1);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x060504);
const PAGE_FOV = 40;                     // the page's own lens
const camera = new THREE.PerspectiveCamera(PAGE_FOV, innerWidth / innerHeight, 0.01, 800);
camera.rotation.order = 'YXZ';
scene.add(camera);

/* ---------- textures ---------- */
const loader = new THREE.TextureLoader();
function loadTex(src, srgb) {
  return new Promise((res, rej) => loader.load(src, (t) => {
    t.flipY = false;
    t.colorSpace = srgb ? THREE.SRGBColorSpace : THREE.NoColorSpace;
    t.minFilter = THREE.LinearMipmapLinearFilter;
    t.magFilter = THREE.LinearFilter;
    t.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
    t.generateMipmaps = true;
    res(t);
  }, undefined, rej));
}

const shared = {
  uPage: { value: null },
  uDepth: { value: null },
  uDepthScale: { value: DEPTH_SCALE },
  uTime: { value: 0 },
  uAgit: { value: 0 },
  uFlash: { value: 0 },
  uCentre: { value: new THREE.Vector2(META.centre[0], META.centre[1]) },
  uAspect: { value: META.aspect },
  uPageSize: { value: new THREE.Vector2(PW, PH) },
};

const GLSL_COMMON = `
  uniform sampler2D uPage;
  uniform sampler2D uDepth;
  uniform float uDepthScale;
  uniform float uTime;
  uniform float uAgit;
  uniform vec2 uCentre;
  uniform float uAspect;
  uniform vec2 uPageSize;
  float depthAt(vec2 puv) { return (texture2D(uDepth, puv).r * 2.0 - 1.0) * uDepthScale; }
  float coreR(vec2 puv) { vec2 d = puv - uCentre; d.y *= uAspect; return length(d); }
  vec3 pagePos(vec2 puv) {
    float z = depthAt(puv);
    float r = coreR(puv);
    float k = exp(-pow(r / 0.16, 2.0));
    z += uAgit * k * 0.035 * sin(uTime * 37.0 + puv.x * 80.0 + puv.y * 63.0);
    z -= uAgit * k * 0.12;
    return vec3((puv.x - 0.5) * uPageSize.x, (0.5 - puv.y) * uPageSize.y, z);
  }
  float hash(float n) { return fract(sin(n) * 43758.5453123); }
`;

/* ---------- page mesh (2.5D relief) ---------- */
// the page shader holds up to BOX_MAX lettering boxes; unused slots are empty rects that mark nothing
const BOX_MAX = 16;
if (META.bubbles.length > BOX_MAX) console.warn(`only the first ${BOX_MAX} lettering boxes can be lifted`);
const bubbleRects = Array.from({ length: BOX_MAX }, (_, i) => META.bubbles[i] ? new THREE.Vector4(...META.bubbles[i].uv) : new THREE.Vector4(2, 2, 2, 2));
const lifts = new Array(BOX_MAX).fill(0);
const pageMat = new THREE.ShaderMaterial({
  uniforms: {
    ...shared,
    uRects: { value: bubbleRects },
    uLifts: { value: lifts },
    uOpacity: { value: 1 },
    uPanelGlow: { value: 0 },
  },
  transparent: true,
  vertexShader: GLSL_COMMON + `
    varying vec2 vPuv;
    void main() {
      vPuv = vec2(uv.x, 1.0 - uv.y);
      vec3 p = pagePos(vPuv);
      gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
    }`,
  fragmentShader: GLSL_COMMON + `
    uniform vec4 uRects[${BOX_MAX}];
    uniform float uLifts[${BOX_MAX}];
    uniform float uOpacity;
    uniform float uFlash;
    uniform float uPanelGlow;
    varying vec2 vPuv;
    void main() {
      vec3 col = texture2D(uPage, vPuv).rgb;
      // "tap to enter": a faint halo around Bob's panel (the depth map's blue channel is its mask)
      if (uPanelGlow > 0.002) {
        float pm = texture2D(uDepth, vPuv).b, halo = 0.0;
        for (int k = 0; k < 12; k++) {
          float a = float(k) * 0.5236;
          vec2 o = vec2(cos(a), sin(a) / uAspect);
          halo += texture2D(uDepth, vPuv + o * 0.012).b + texture2D(uDepth, vPuv + o * 0.03).b;
        }
        halo /= 24.0;
        col += vec3(1.0, 0.93, 0.82) * max(halo - pm, 0.0) * 1.9 * uPanelGlow;
        col *= 1.0 + 0.07 * pm * uPanelGlow;
      }
      for (int i = 0; i < ${BOX_MAX}; i++) {
        vec4 r = uRects[i];
        vec2 m = smoothstep(r.xy - 0.004, r.xy + 0.004, vPuv) * (1.0 - smoothstep(r.zw - 0.004, r.zw + 0.004, vPuv));
        col *= 1.0 - 0.96 * uLifts[i] * m.x * m.y;
      }
      float r = coreR(vPuv);
      float pulse = 0.5 + 0.5 * sin(uTime * (1.6 + uAgit * 6.0));
      col += vec3(1.0, 0.96, 0.9) * exp(-pow(r / 0.07, 2.0)) * (0.10 + 0.12 * pulse) * (1.0 + 2.5 * uAgit);
      col += vec3(0.55, 0.42, 0.3) * exp(-pow(r / 0.2, 2.0)) * 0.12 * uAgit * pulse;
      col *= 1.0 + uFlash * 0.6 * (0.5 + 0.5 * sin(vPuv.y * 900.0 + uTime * 60.0));
      gl_FragColor = vec4(col, uOpacity);
      #include <colorspace_fragment>
    }`,
});
const pageMesh = new THREE.Mesh(new THREE.PlaneGeometry(PW, PH, 320, Math.round(320 * META.aspect)), pageMat);
scene.add(pageMesh);

/* ---------- lifted bubbles ---------- */
const bubbleZ = 0.24 * DEPTH_SCALE + 0.006;
// distance inside a box's outline (negative outside), in page widths; uPoly as polyUniform makes it
const POLY_GLSL = `
  uniform vec2 uPoly[8]; uniform int uPolyN; uniform float uAspect;
  float polyInside(vec2 q) {
    if (uPolyN < 3) return 1.0;
    float d = 1.0;
    for (int i = 0; i < 8; i++) {
      if (i >= uPolyN) break;
      vec2 a = uPoly[i];
      vec2 b = uPoly[0];
      if (i + 1 < uPolyN) b = uPoly[i + 1 < 8 ? i + 1 : 7];
      vec2 e = normalize(b - a);
      d = min(d, (q - a).y * e.x - (q - a).x * e.y);
    }
    return d;
  }
`;
// each box's own outline (tools/trace_bubbles.py), in page UV with v scaled to page units so
// distances are even both ways; wound so the inside is on the positive side of every edge
function polyUniform(poly) {
  const pts = (poly || []).map(([u, v]) => new THREE.Vector2(u, v * META.aspect));
  let area = 0;
  pts.forEach((p, i) => { const q = pts[(i + 1) % pts.length]; area += p.x * q.y - q.x * p.y; });
  if (area < 0) pts.reverse();
  const n = pts.length;
  while (pts.length < 8) pts.push(pts[pts.length - 1] || new THREE.Vector2());
  return { pts: pts.slice(0, 8), n: Math.min(n, 8) };
}
const bubbles = META.bubbles.map((b, i) => {
  const [u0, v0, u1, v1] = b.uv;
  const poly = polyUniform(b.poly);
  const mat = new THREE.ShaderMaterial({
    uniforms: { uPage: shared.uPage, uRect: { value: new THREE.Vector4(u0, v0, u1, v1) }, uFlick: { value: 0 }, uTime: shared.uTime, uOpacity: { value: 1 }, uGlow: { value: 0 },
      uPoly: { value: poly.pts }, uPolyN: { value: poly.n }, uAspect: { value: META.aspect }, uBlank: { value: b.blank ?? 2 }, uInvert: { value: 0 } },
    transparent: true,
    depthWrite: false,
    vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
    fragmentShader: `
      uniform sampler2D uPage; uniform vec4 uRect; uniform float uFlick; uniform float uTime; uniform float uOpacity; uniform float uGlow; uniform float uBlank; uniform float uInvert;
      varying vec2 vUv;
      ${POLY_GLSL}
      void main(){
        vec2 p = mix(uRect.xy, uRect.zw, vec2(vUv.x, 1.0 - vUv.y));
        float inside = smoothstep(-0.0005, 0.0004, polyInside(vec2(p.x, p.y * uAspect)));
        vec3 col = texture2D(uPage, p).rgb;
        if (p.y > uBlank) col = vec3(1.0);   // lettering cut from the line (meta.json blank): the box's white over it
        col = mix(col, vec3(1.0) - col, uInvert);   // negative: black type out of white (a beat's invert)
        float scan = 0.82 + 0.18 * sin(gl_FragCoord.y * 1.7 + uTime * 30.0);
        float jitter = 0.75 + 0.5 * fract(sin(floor(uTime * 24.0) * 12.9898) * 43758.5453);
        col *= mix(1.0, scan * jitter, uFlick);
        col += vec3(0.25, 0.22, 0.18) * uGlow;
        float edge = smoothstep(0.0, 0.015, vUv.x) * smoothstep(0.0, 0.015, 1.0 - vUv.x) * smoothstep(0.0, 0.03, vUv.y) * smoothstep(0.0, 0.03, 1.0 - vUv.y);
        gl_FragColor = vec4(col, uOpacity * edge * inside);
        #include <colorspace_fragment>
      }`,
  });
  const w = (u1 - u0) * PW, h = (v1 - v0) * PH;
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat);
  const c = uvToWorld((u0 + u1) / 2, (v0 + v1) / 2);
  mesh.position.set(c.x, c.y, bubbleZ);
  mesh.visible = false;
  mesh.renderOrder = 2;
  scene.add(mesh);
  const hit = new THREE.Mesh(new THREE.PlaneGeometry(w * 1.5, h * 2.2), new THREE.MeshBasicMaterial({ visible: false }));
  mesh.add(hit);
  return { ...b, i, mesh, mat, hit, base: c, lift: 0, vel: 0, target: 0, flickT: 0, tilt: (Math.random() - 0.5) * 0.07 };
});
const bubbleById = Object.fromEntries(bubbles.map((b) => [b.id, b]));

/* ---------- vortex inflow particles ---------- */
const INFLOW = 1400;
const inflowGeo = new THREE.BufferGeometry();
{
  const seed = new Float32Array(INFLOW * 3);
  for (let i = 0; i < INFLOW; i++) { seed[i * 3] = Math.random(); seed[i * 3 + 1] = Math.random(); seed[i * 3 + 2] = Math.random(); }
  inflowGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(INFLOW * 3), 3));
  inflowGeo.setAttribute('seed', new THREE.BufferAttribute(seed, 3));
}
const inflowMat = new THREE.ShaderMaterial({
  uniforms: { ...shared, uScale: { value: 1 } },
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: GLSL_COMMON + `
    attribute vec3 seed; uniform float uScale; varying float vA;
    void main(){
      float ph = fract(seed.x + uTime * (0.10 + seed.y * 0.22) * (0.4 + uAgit));
      float rad = mix(0.55, 0.012, ph * ph);
      float ang = seed.z * 6.2831 + ph * (3.0 + seed.y * 4.0);
      vec2 puv = uCentre + vec2(cos(ang), sin(ang) / uAspect) * rad;
      vec3 p = pagePos(clamp(puv, 0.0, 1.0));
      p.z += 0.02;
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      gl_Position = projectionMatrix * mv;
      gl_PointSize = (1.5 + seed.y * 2.5) * uScale * 0.004 / -mv.z;
      vA = uAgit * smoothstep(0.0, 0.15, ph) * (1.0 - smoothstep(0.85, 1.0, ph));
    }`,
  fragmentShader: `varying float vA; void main(){ vec2 c = gl_PointCoord - 0.5; float a = exp(-dot(c,c) * 14.0); gl_FragColor = vec4(vec3(0.94,0.91,0.86) * a * vA, 1.0); }`,
});
const inflow = new THREE.Points(inflowGeo, inflowMat);
inflow.frustumCulled = false;
scene.add(inflow);

/* ---------- page as particles (used for the breach) ---------- */
const NX = 380, NY = Math.round(380 * META.aspect);
const ptsGeo = new THREE.BufferGeometry();
{
  const puv = new Float32Array(NX * NY * 2), rnd = new Float32Array(NX * NY);
  let k = 0;
  for (let y = 0; y < NY; y++) for (let x = 0; x < NX; x++) {
    puv[k * 2] = (x + 0.5) / NX; puv[k * 2 + 1] = (y + 0.5) / NY; rnd[k] = Math.random(); k++;
  }
  ptsGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(NX * NY * 3), 3));
  ptsGeo.setAttribute('puv', new THREE.BufferAttribute(puv, 2));
  ptsGeo.setAttribute('rnd', new THREE.BufferAttribute(rnd, 1));
}
const ptsMat = new THREE.ShaderMaterial({
  uniforms: { ...shared, uT: { value: 0 }, uScale: { value: 1 }, uSpacing: { value: PW / NX }, uCentreW: { value: new THREE.Vector2(CX, CY) } },
  transparent: true, depthWrite: false,
  vertexShader: GLSL_COMMON + `
    attribute vec2 puv; attribute float rnd;
    uniform float uT; uniform float uScale; uniform float uSpacing; uniform vec2 uCentreW;
    varying vec3 vCol; varying float vA;
    void main(){
      vec3 p = pagePos(puv);
      vCol = texture2D(uPage, puv).rgb;
      vec2 d = p.xy - uCentreW;
      float r = length(d) / 2.2;
      float tr = r * 0.42 + rnd * 0.12;
      float l = clamp((uT - tr) / 0.42, 0.0, 1.0);
      float e = l * l;
      float ang = e * (0.8 + rnd * 1.6) * (rnd > 0.5 ? 1.0 : -1.0);
      float cs = cos(ang), sn = sin(ang);
      d = vec2(d.x * cs - d.y * sn, d.x * sn + d.y * cs);
      p.xy = uCentreW + d * (1.0 + e * (1.2 + rnd * 3.5));
      p.z += e * (0.6 + rnd * 3.0);
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      gl_Position = projectionMatrix * mv;
      float lum = dot(vCol, vec3(0.333));
      gl_PointSize = max(1.0, uSpacing * uScale * (1.9 + e * 1.5) / -mv.z);
      vA = (1.0 - smoothstep(0.55, 1.0, l)) * mix(1.0, smoothstep(0.07, 0.4, lum), smoothstep(0.0, 0.35, l));
    }`,
  fragmentShader: `
    varying vec3 vCol; varying float vA;
    void main(){
      vec2 c = gl_PointCoord - 0.5; float a = exp(-dot(c,c) * 9.0);
      if (a * vA < 0.02) discard;
      gl_FragColor = vec4(vCol, a * vA);
      #include <colorspace_fragment>
    }`,
});
const pagePts = new THREE.Points(ptsGeo, ptsMat);
pagePts.frustumCulled = false;
pagePts.visible = false;
scene.add(pagePts);

/* ---------- the void ---------- */
const P0 = new THREE.Vector3(CX, CY, VOID_Z);
const voidU = {
  uFog: { value: 0.6 },
  uBg: { value: new THREE.Color(0x060504) },
  uPaper: { value: new THREE.Color(0xefe9df) },
  uInk: { value: new THREE.Color(0x050403) },
  uSepia: { value: new THREE.Color(0x8a6a4a) },
  uLight: { value: new THREE.Vector3(0.45, 0.75, 0.5).normalize() },
  uPx: { value: renderer.getPixelRatio() },
  uTime: shared.uTime,
};
const FOG_GLSL = `uniform float uFog; uniform vec3 uBg; float fogF(float d){ return 1.0 - exp(-uFog * uFog * d * d); }`;
const inkMat = new THREE.ShaderMaterial({
  uniforms: voidU,
  vertexShader: `
    varying vec3 vN; varying vec3 vW; varying float vDist;
    void main(){
      vN = normalize(mat3(modelMatrix) * normal);
      vec4 w = modelMatrix * vec4(position, 1.0); vW = w.xyz;
      vec4 mv = viewMatrix * w; vDist = -mv.z;
      gl_Position = projectionMatrix * mv;
    }`,
  fragmentShader: FOG_GLSL + `
    uniform vec3 uPaper; uniform vec3 uInk; uniform vec3 uSepia; uniform vec3 uLight; uniform float uPx;
    varying vec3 vN; varying vec3 vW; varying float vDist;
    void main(){
      vec3 n = normalize(vN);
      float d = max(dot(n, uLight), 0.0);
      vec3 v = normalize(cameraPosition - vW);
      float rim = pow(1.0 - abs(dot(n, v)), 3.0);
      vec2 p = gl_FragCoord.xy / uPx;
      float wob = sin(vW.y * 2.3 + vW.x * 1.7) * 2.0 + sin(vW.z * 3.1) * 1.2;
      float s = 9.0;
      float l1 = step(fract((p.x * 0.9 + p.y + wob) / s), 0.34);
      float l2 = step(fract((p.x - p.y * 0.8 - wob) / s), 0.3);
      float grit = fract(sin(dot(floor(p / 2.0), vec2(12.9898, 78.233))) * 43758.5453);
      float w = 0.0;
      if (d > 0.35) w = l1;
      if (d > 0.7) w = max(w, l2);
      if (d > 0.9) w = 1.0 - (1.0 - l1) * step(grit, 0.25);
      vec3 col = mix(uInk, uPaper, w);
      col = mix(col, uSepia * 0.45, step(0.96, grit) * (1.0 - w) * 0.6);
      col += uPaper * rim * rim * 0.5;
      col = mix(col, uBg, fogF(vDist));
      gl_FragColor = vec4(col, 1.0);
      #include <colorspace_fragment>
    }`,
});
const edgeMat = new THREE.ShaderMaterial({

        float lum = dot(rgb, vec3(0.299, 0.587, 0.114)) + (otHash(id * 0.618) - 0.5) * ${i.grit};
        float w = max(0.004, (${i.hi} - ${i.lo}) * 0.25);
        float midW = smoothstep(${i.lo} - w, ${i.lo} + w, lum);
        float paperW = smoothstep(${i.hi} - w, ${i.hi} + w, lum);
        vec3 grainy = mix(${i.ink}, vec3(0.32, 0.25, 0.17), step(1.0 - ${i.grain}, otHash(id * 1.37)) * 0.55);
        vec3 inked = mix(mix(grainy, ${i.mid}, midW), ${i.paper}, paperW);
        if (${i.gmode} > 0.5) {
          // palette grade: to YCbCr, towards the crop's colour statistics, then a soft pull to its main colours
          vec3 y = vec3(dot(rgb, vec3(0.299, 0.587, 0.114)), dot(rgb, vec3(-0.168736, -0.331264, 0.5)), dot(rgb, vec3(0.5, -0.418688, -0.081312)));
          y = mix(y, (y - ${i.mw}) / ${i.sw} * ${i.sc} + ${i.mc}, ${i.transfer});
          y.x += (otHash(id * 0.618) - 0.5) * ${i.grit};
          vec3 wt = vec3(1.6, 1.0, 1.0);
          float dm = 1e9;
          ${Array.from({ length: PAL_N }, (_, k) => `vec3 q${k} = vec3(dot(${i['pal' + k]}, vec3(0.299, 0.587, 0.114)), dot(${i['pal' + k]}, vec3(-0.168736, -0.331264, 0.5)), dot(${i['pal' + k]}, vec3(0.5, -0.418688, -0.081312)));
          float d${k} = ${k}.0 < ${i.npal} ? dot((y - q${k}) * wt, (y - q${k}) * wt) : 1e9; dm = min(dm, d${k});`).join('\n          ')}
          float s2 = ${i.soft} * ${i.soft};
          vec3 acc = vec3(0.0); float ws = 0.0;
          ${Array.from({ length: PAL_N }, (_, k) => `{ float e = exp(-(d${k} - dm) / s2); acc += q${k} * e; ws += e; }`).join('\n          ')}
          y = mix(y, acc / ws, ${i.pull});
          inked = clamp(vec3(y.x + 1.402 * y.z, y.x - 0.344136 * y.y - 0.714136 * y.z, y.x + 1.772 * y.y), 0.0, 1.0);
        }
        inked *= 1.0 + ${i.jitter} * 0.6 * step(0.8, otHash(floor(c.y * 34.0) + floor(${i.time} * 22.0)));
        ${o.gsplat}.rgba.rgb = mix(rgb, inked, ${i.grade});
        ${o.gsplat}.scales *= mix(1.0, ${i.size}, ${i.grade});
        float d = length(c);
        if ((${i.extrude} > 0.0 || ${i.depth} != 1.0) && d > 1e-4) {
          vec3 dir = c / d;
          float ex = ${i.extrude};
          vec2 cell = floor(vec2(atan(dir.x, dir.z) * 9.0, asin(clamp(-dir.y, -1.0, 1.0)) * 7.0));
          float cellId = cell.x * 37.0 + cell.y * 101.0;
          float slip = otHash(cellId);
          float epoch = floor(${i.time} * 0.35 + otHash(cellId * 3.1) * 4.0);
          float jump = step(0.86, otHash(cellId + epoch * 13.0)) * (otHash(cellId * 7.0 + epoch) - 0.5);
          float pull = ex * (0.26 * paperW + 0.1 * midW + 0.16 * slip * step(0.5, slip) + 0.24 * jump);
          // shrink each splat by the factor it moves, so from the viewpoint the drawing looks
          // as it did and the layers only show as the camera moves
          float k = ${i.depth} * clamp(1.0 - pull, 0.3, 1.3);
          c = dir * d * k;
          ${o.gsplat}.scales *= k;
          // a few streaks, half of them ink smears rather than light, so they never wash the page out
          if (otHash(id * 2.7) < 0.022 * ex && (paperW > 0.5 || otHash(id * 5.3) < 0.5)) {
            // a streak: the splat turned to face along the line of sight and drawn out
            vec3 sc = ${o.gsplat}.scales;
            float thin = min(sc.x, sc.y);
            vec3 axis = vec3(-dir.y, dir.x, 0.0);             // cross((0, 0, 1), dir)
            float wq = 1.0 + dir.z;
            ${o.gsplat}.quaternion = wq > 1e-4 ? normalize(vec4(axis, wq)) : vec4(1.0, 0.0, 0.0, 0.0);
            ${o.gsplat}.scales = vec3(thin, thin, max(sc.x, sc.y) * (1.0 + 3.0 * ex * (0.4 + paperW)));
            ${o.gsplat}.rgba.a *= 0.7;
          }
        }
        ${o.gsplat}.center = c;
        ${o.gsplat}.rgba.a *= ${i.alpha} * mix(1.0, paperW, ${i.brightOnly});
      `],
    });
    return { gsplat: node.outputs.gsplat };
  });
}

function worldMeshes() { return worlds.mesh ? [worlds.mesh, ...worlds.echoes, ...(worlds.sandMesh ? [worlds.sandMesh] : [])] : []; }

// Sands of time: the world's lighter splat file again, shrunk to grains and spread
// through the space between the viewer and the world. They swirl about the line of
// sight towards the core (faster near the centre) and are flung slowly outward as they
// drift towards the viewer, then fade and start again. Coarse cells of space are dense
// or sparse, so the grains gather in drifts. Every depth holding something that moves is
// what makes the space read in 3D.
function sandModifier() {
  const { dyno } = worlds.Spark, u = worlds.u;
  return dyno.dynoBlock({ gsplat: dyno.Gsplat }, { gsplat: dyno.Gsplat }, ({ gsplat }) => {
    const node = dyno.dyno({
      inTypes: { gsplat: dyno.Gsplat, time: 'float', sand: 'float', mist: 'float', paper: 'vec3' },
      outTypes: { gsplat: dyno.Gsplat },
      inputs: { gsplat, time: u.time, sand: u.sand, mist: u.mist, paper: u.paper },
      globals: () => [dyno.defineGsplat, `
        float otSandHash(float n) { return fract(sin(n) * 43758.5453123); }
      `],
      statements: ({ inputs: i, outputs: o }) => [`
        ${o.gsplat} = ${i.gsplat};
        vec3 c = ${o.gsplat}.center;
        float id = float(${o.gsplat}.index);
        float h1 = otSandHash(id * 0.731), h2 = otSandHash(id * 1.913), h3 = otSandHash(id * 2.477), h4 = otSandHash(id * 3.119);
        float d = max(length(c), 1e-4);
        vec3 dir = c / d;
        // drifts: coarse cells of space are dense or sparse
        float dens = otSandHash(dot(floor(c * 2.2), vec3(17.0, 59.0, 113.0)));
        // sand scales how many grains show: 1 in Marble worlds, less over a relief so the face reads
        float keep = step(1.0 - ${i.sand} * (0.03 + 0.9 * smoothstep(0.62, 0.97, dens)), h4);
        // start anywhere between the viewer and the world
        vec3 p0 = dir * d * mix(0.2, 0.95, h1);
        float cyc = fract(${i.time} * (0.015 + 0.025 * h2) + h3);
        float r0 = length(p0.xy) + 0.02;
        float r = r0 * (0.55 + 1.1 * cyc);                                  // flung outward
        float a = atan(p0.y, p0.x) + ${i.time} * 0.2 / (0.25 + r) * (0.8 + 0.4 * h2);   // swirl, faster near the axis
        float z = p0.z - cyc * 0.3 * d;                                      // drifting towards the viewer
        ${o.gsplat}.center = vec3(cos(a) * r, sin(a) * r, z);
        float len = length(${o.gsplat}.center);
        float g = 0.0008 * len + 0.00015;                                     // fine grains, about the same size on screen
        // drawn out a little along the swirl, like sand in a long exposure
        float th = 0.5 * (a + 1.5708);
        ${o.gsplat}.quaternion = vec4(0.0, 0.0, sin(th), cos(th));
        // 30% are data points (Paul): about a quarter the size, round, and pure white so they stay crisp
        float dataPt = step(fract(h2 * 13.7 + h3 * 7.1), 0.3);
        ${o.gsplat}.scales = mix(vec3(g * (1.5 + 2.5 * h2), g, g), vec3(g * 0.28), dataPt);
        vec3 col = mix(mix(${i.paper}, vec3(0.62, 0.48, 0.33), step(0.72, h3)), vec3(1.0), dataPt);
        // opacity above 1 gives Spark a hard edge, so a grain reads as a point rather than a soft blob
        // no grains right at the viewpoint, where they would fill the screen
        float near = smoothstep(0.22, 0.38, len);
        ${o.gsplat}.rgba = vec4(col, keep * near * sin(3.14159 * cyc) * 1.8);
        if (${i.mist} > 0.5) {
          // mist (Paul, 25 October: sand was used too often): a few large, soft, faint puffs drifting slowly
          // sideways and up through the space, in the palette's light colour
          float keepM = step(1.0 - ${i.sand} * 0.04, h4);
          vec3 q0 = dir * d * mix(0.35, 0.9, h1);
          float cm = fract(${i.time} * (0.006 + 0.01 * h2) + h3);
          vec3 cen = q0 + vec3((cm - 0.5) * 0.3 * d * (h2 - 0.5), -cm * 0.08 * d, 0.0);
          float lm = length(cen);
          float sz = (0.035 + 0.05 * h1) * lm;
          float ang = h3 * 6.2832;
          ${o.gsplat}.center = cen;
          ${o.gsplat}.quaternion = vec4(0.0, 0.0, sin(ang * 0.5), cos(ang * 0.5));
          ${o.gsplat}.scales = vec3(sz, sz * 0.55, sz);
          vec3 mc = mix(${i.paper}, vec3(dot(${i.paper}, vec3(0.299, 0.587, 0.114))), 0.35) * 0.9;
          ${o.gsplat}.rgba = vec4(mc, keepM * smoothstep(0.45, 0.9, lm) * sin(3.14159 * cm) * 0.065);
        }
      `],
    });
    return { gsplat: node.outputs.gsplat };
  });
}

async function fetchJson(url) { const r = await fetch(url); if (!r.ok) throw new Error(`${url} ${r.status}`); return r.json(); }

// Load a world by id. Resolves once the splats are ready, or rejects.
function loadWorld(id) {
  worlds.loading = (async () => {
    await loadSpark();
    if (!worlds.list.length) {
      const [list, views, reliefs] = await Promise.all([
        fetchJson('worlds/worlds.json'), fetchJson('worlds/views.json').catch(() => ({})), fetchJson('worlds/reliefs.json').catch(() => ({ worlds: [] })),
      ]);
      // Marble worlds, then reliefs built from the page itself (tools/make_bob_head.py)
      worlds.list = [...(list.worlds || []), ...(reliefs.worlds || [])]; worlds.views = views;
    }
    const entry = worlds.list.find((w) => w.id === id);
    if (!entry) throw new Error(`no world ${id}`);
    const view = entry.relief ? entry : worlds.views[id] || {};
    const files = view.files || entry.splats;
    // the 100k files are too coarse to read as anything, so phones get 500k unless memory is short
    const lowMemory = (navigator.deviceMemory || 8) < 4;
    const url = (lowMemory && files['100k']) || files['500k'];
    if (worlds.mesh && worlds.id === id) return worlds.mesh;
    const { mesh, echoes, sandMesh } = await (worlds.prepared[id] || makeWorldMeshes(entry, files, url));
    delete worlds.prepared[id];
    // swap only once the new world is ready, so there is never a gap
    for (const old of worldMeshes()) { scene.remove(old); old.dispose?.(); }
    for (const m of [mesh, ...echoes, ...(sandMesh ? [sandMesh] : [])]) {
      m.quaternion.set(1, 0, 0, 0);            // Marble's OpenCV axes (y down, +z ahead) to three's
      m.scale.setScalar(WORLD_SCALE);
      m.position.copy(P0);
      m.visible = state.stage === 'breach' || state.stage === 'void';
      scene.add(m);
    }
    worlds.mesh = mesh; worlds.echoes = echoes; worlds.sandMesh = sandMesh; worlds.id = id; worlds.ok = true;
    worlds.relief = !!entry.relief;
    worlds.u.sand.value = sandLevel();
    worlds.u.mist.value = atmosOf(id) === 'mist' ? 1 : 0;
    worlds.u.cut.value = id === STORY_WORLD && SP.slab ? 1 : 0;   // Marble's white slab is cut out of the singularity
    // animated or cut regions of this world (setPieces.animate)
    const regs = (SP.animate || []).filter((a) => a.world === id).slice(0, 2);
    [0, 1].forEach((r) => {
      const a = regs[r], K = { smoke: 1, trail: 2, cut: 3 };
      worlds.u[`r${r}a`].value.set(...(a ? [...(a.yaw || [-180, 180]), ...(a.pitch || [-90, 90])] : [0, 0, 0, 0]));
      worlds.u[`r${r}b`].value.set(...(a ? [...(a.dist || [0, 1e4]), a.lum ?? 0, a.sat ?? 1] : [0, 0, 0, 0]));
      worlds.u[`r${r}k`].value.set(a ? K[a.kind] || 0 : 0, a ? a.rise ?? a.freq ?? 1 : 0, a ? a.speed ?? 0.1 : 0, 0);
    });
    const fh = SP.helix && helix.on && id === SP.helix.world && SP.helix.fadeHue;
    worlds.u.fade.value.set(fh ? fh[0] : 0, fh ? fh[1] : 0, fh ? fh[2] ?? 0.5 : 1, fh ? fh[3] ?? 0.85 : 0);
    // the grade measured from the world's crop by tools/clean_worlds.py; a relief is the page's own ink
    const g = view.grade;
    worlds.relief = !!entry.relief;
    worlds.u.grade.value = entry.relief ? 0 : 1;
    worlds.u.extrude.value = entry.relief ? 0 : worlds.extrudeOn ? 1 : 0;
    worlds.parallax = entry.parallax || 2.0;
    worlds.radius = view.radius || 1.2;
    // the wander's scale, kept within the clear space ahead (deep worlds have scenery near the viewpoint)
    worlds.wanderR = view.clear ? Math.min(worlds.radius, 1.2 * view.clear) : worlds.radius;
    worlds.u.gmode.value = g && g.mode === 'palette' ? 1 : 0;
    if (g && g.mode === 'palette') {
      worlds.u.lo.value = g.lo; worlds.u.hi.value = g.hi;
      for (const k of ['mw', 'sw', 'mc', 'sc']) worlds.u[k].value.fromArray(g[k]);
      worlds.u.transfer.value = g.transfer ?? 0.6; worlds.u.pull.value = g.pull ?? 0.45; worlds.u.soft.value = g.soft ?? 0.08;
      const pal = g.palette.slice(0, PAL_N);
      worlds.u.npal.value = pal.length;
      pal.forEach((c, k) => worlds.u[`pal${k}`].value.fromArray(c));
      // the sand takes the palette's lightest colour
      worlds.u.paper.value.fromArray(pal[pal.length - 1]);
    } else if (g) {
      worlds.u.lo.value = g.lo; worlds.u.hi.value = g.hi;
      worlds.u.ink.value.fromArray(g.ink); worlds.u.mid.value.fromArray(g.mid); worlds.u.paper.value.fromArray(g.paper);
    }
    // look limits from tools/clean_worlds.py, in Marble's frame (yaw right is positive) to the camera's
    const y = view.yaw || [-180, 180], p = view.pitch || [-75, 75];
    worlds.limits = { yaw: [-y[1] * DEG, -y[0] * DEG], pitch: [p[0] * DEG, p[1] * DEG] };
    return mesh;
  })();
  return worlds.loading;
}

// a world's meshes: the splats, two echo layers (the lighter file again, nearer and fainter, bright ink only; not for
// reliefs) and the sand, decoded and ready
async function makeWorldMeshes(entry, files, url) {
  const mesh = new worlds.Spark.SplatMesh({ url, objectModifier: inkModifier() });
  // echoes add ghost depth to thin shells; a comic whose worlds are deep turns them off with the extrusion
  const echoes = entry.relief || COMIC.extrude === false ? [] : [[0.8, 0.14], [0.64, 0.07]].map(([depth, alpha]) =>
    new worlds.Spark.SplatMesh({ url: files['100k'] || url, objectModifier: inkModifier({ depth, alpha, brightOnly: 1 }) }));
  const sandMesh = worlds.sandOn || REVIEW ? new worlds.Spark.SplatMesh({ url: files['100k'] || url, objectModifier: sandModifier() }) : null;
  await Promise.all([mesh.initialized, ...echoes.map((e) => e.initialized), ...(sandMesh ? [sandMesh.initialized] : [])]);
  return { mesh, echoes, sandMesh };
}
// build a world ahead of when it is needed (Paul: the glyphs after "Initiating QNTM CTRL..." froze while the
// singularity loaded and decoded): the singularity is prepared while the reader is on the biometric pad
function prepareWorld(id) {
  if (worlds.prepared[id] || (worlds.mesh && worlds.id === id) || !worlds.list.length || !worlds.Spark) return;
  const entry = worlds.list.find((w) => w.id === id);
  if (!entry) return;
  const view = entry.relief ? entry : worlds.views[id] || {}, files = view.files || entry.splats;
  const url = ((navigator.deviceMemory || 8) < 4 && files['100k']) || files['500k'];
  worlds.prepared[id] = makeWorldMeshes(entry, files, url);
  worlds.prepared[id].catch(() => { delete worlds.prepared[id]; });
}

function useWorld(on) {
  // the procedural void stays as the fallback; the world replaces it when present
  voidGroup.visible = !on && (state.stage === 'breach' || state.stage === 'void');
  for (const m of worldMeshes()) m.visible = on;
}

function updateWorld(dt, t) {
  if (!worlds.mesh || !worlds.u) return;
  const u = worlds.u;
  // none from just before "To be continued..." until a few seconds after its line (Paul: no static over it)
  const tbcQuiet = state.endT > 6 && state.endT < 14;
  if (state.stage === 'void' && !REVIEW && (!journey.on || journey.done) && t > worlds.nextCrackle && !tbcQuiet) {
    // the transmitter still crackles: a burst of static shears the world for a moment
    worlds.nextCrackle = t + 9 + Math.random() * 8;
    worlds.jitter = 1; sound.staticBurst();
  }
  worlds.jitter = Math.max(0, worlds.jitter - dt * 1.6);
  // the extrusion's blocks jump on a clock, so it needs a refresh about ten times a second
  // animated regions (smoke, trails) move smoothly at 24 refreshes a second
  const animated = u.r0k.value.x > 0 || u.r1k.value.x > 0;
  const tick = animated ? Math.floor(t * 24) : u.extrude.value > 0 ? Math.floor(t * 10) : -1;
  const changed = u.suction.value !== worlds.suction || worlds.jitter > 0 || u.jitter.value > 0 || tick !== worlds.lastTick;
  worlds.lastTick = tick;
  u.time.value = t; u.suction.value = worlds.suction; u.jitter.value = worlds.jitter;
  if (changed) for (const m of worldMeshes()) m.updateVersion();
  else if (worlds.sandMesh && u.sand.value > 0) worlds.sandMesh.updateVersion();   // the sand moves every frame
}

/* ---------- sound ---------- */
class Sound {
  constructor() { this.ok = false; this.muted = false; this.voices = []; }
  start() {
    try {
      const C = window.AudioContext || window.webkitAudioContext;
      this.ctx = new C();
    } catch (e) { return; }
    const ctx = this.ctx; this.ok = true;
    this.master = ctx.createGain(); this.master.gain.value = 0.85;
    const comp = ctx.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 4;
    // a safety limiter on everything, so voices and music together never clip
    const out = ctx.createDynamicsCompressor(); out.threshold.value = -1; out.knee.value = 0; out.ratio.value = 20; out.attack.value = 0.001; out.release.value = 0.1;
    this.master.connect(comp).connect(out).connect(ctx.destination);
    // music skips the master compressor, which squashed it (its soft knee starts about -29 dB, so a louder loop
    // came out barely louder and clipped; Paul: "music at max volume is still too soft by 10db"): its own fast
    // limiter instead, then the same 0.85 and mute as the master
    this.musicLim = ctx.createDynamicsCompressor();
    this.musicLim.threshold.value = -8; this.musicLim.knee.value = 0; this.musicLim.ratio.value = 20; this.musicLim.attack.value = 0.001; this.musicLim.release.value = 0.06;
    this.musicOut = ctx.createGain(); this.musicOut.gain.value = 0.85;
    this.musicOut.connect(out);                     // musicBus wires the limiter, the dip and the reader's volume in front of it
    this.noise = this.makeNoise(2);
    this.loadSfx();
    // cabin: muffled hum plus tape hiss
    this.cabinLP = ctx.createBiquadFilter(); this.cabinLP.type = 'lowpass'; this.cabinLP.frequency.value = 320; this.cabinLP.Q.value = 0.7;
    this.cabin = ctx.createGain(); this.cabin.gain.value = 0;
    this.cabinLP.connect(this.cabin).connect(this.master);
    [[55, 'sawtooth', 0.05], [55.35, 'sawtooth', 0.05], [110.2, 'sine', 0.04], [27.5, 'sine', 0.12]].forEach(([f, t, g]) => {
      const o = ctx.createOscillator(); o.type = t; o.frequency.value = f; const gg = ctx.createGain(); gg.gain.value = g; o.connect(gg).connect(this.cabinLP); o.start();
    });
    const hiss = ctx.createBufferSource(); hiss.buffer = this.noise; hiss.loop = true;
    const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 5000;
    this.hiss = ctx.createGain(); this.hiss.gain.value = 0.012;
    hiss.connect(hp).connect(this.hiss).connect(this.master); hiss.start();
    this.cabin.gain.setTargetAtTime(1, ctx.currentTime, 1.2);
    this.reverb = ctx.createConvolver(); this.reverb.buffer = this.makeIR(4.5);
    this.wet = ctx.createGain(); this.wet.gain.value = 0.6; this.reverb.connect(this.wet).connect(this.master);
    this.loadVoices();
  }
  makeNoise(sec) { const ctx = this.ctx, b = ctx.createBuffer(1, ctx.sampleRate * sec, ctx.sampleRate), d = b.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; return b; }
  makeIR(sec) { const ctx = this.ctx, n = ctx.sampleRate * sec, b = ctx.createBuffer(2, n, ctx.sampleRate); for (let c = 0; c < 2; c++) { const d = b.getChannelData(c); for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2.6); } return b; }
  now() { return this.ctx.currentTime; }
  staticBurst(len = 0.65) {
    if (!this.ok) return; const ctx = this.ctx, t = this.now();
    const s = ctx.createBufferSource(); s.buffer = this.noise;
    const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 0.9; bp.frequency.setValueAtTime(900, t); bp.frequency.exponentialRampToValueAtTime(3200, t + 0.5);
    const g = ctx.createGain(); g.gain.setValueAtTime(0, t);
    for (let i = 0; i < Math.round(len / 0.045) + 1; i++) g.gain.setValueAtTime(Math.random() * 0.55, t + i * 0.045);
    g.gain.setTargetAtTime(0, t + len, 0.08);
    s.connect(bp).connect(g).connect(this.master); s.start(t); s.stop(t + len + 0.6);
  }
  blip() {
    if (!this.ok) return; const ctx = this.ctx, t = this.now();
    [0, 0.09].forEach((dt, i) => {
      const o = ctx.createOscillator(); o.type = 'square'; o.frequency.value = i ? 1180 : 1560;
      const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1500; bp.Q.value = 3;
      const g = ctx.createGain(); g.gain.setValueAtTime(0.0, t + dt); g.gain.linearRampToValueAtTime(0.06, t + dt + 0.005); g.gain.setTargetAtTime(0, t + dt + 0.05, 0.015);
      o.connect(bp).connect(g).connect(this.master); o.start(t + dt); o.stop(t + dt + 0.2);
    });
  }
  // Paul's sound effects (assets/sfx, tools/make_sfx.py), decoded once on the Start tap. Each has its
  // own level, as they arrive at different loudness. Where one is missing the synthesised sound stays.
  loadSfx() {

  // momentarily comes over touch screen"); drawPad takes it away when the line ends or the reader presses

    c.strokeStyle = ink(Math.max(0, 1 - b * 1.6)); c.lineWidth = 2;
    for (const k of [0, 0.12, 0.24]) { const rr = (b - k) * R * 1.4; if (rr > 0) { c.beginPath(); c.arc(x, y, rr, 0, 6.283); c.stroke(); } }

function primeFilms() {
  if (!films.index?.clips || REVIEW) return;
  for (const id of Object.keys(films.index.clips)) {
    const v = filmVideo(id);
    v.play().then(() => { if (!films.on || !v.classList.contains('cur')) v.pause(); }).catch(() => { /* tried again at its cue */ });
  }
}
function playFilm(beat) {

  const v = v0;

    // sync (a lipsync take): wait for the line to start, then start the film that far in, so the lips follow the voice
    let from = cue.from || 0, vs = null;
    if (cue.sync && sound.ok) {
      for (let k = 0; k < 30 && sound.voiceSpan?.beat !== beat; k++) await new Promise((r) => setTimeout(r, 50));
      vs = sound.voiceSpan;
      if (vs?.beat === beat) {
        const lead = vs.t0 - sound.now();
        if (lead > 0) await new Promise((r) => setTimeout(r, lead * 1000)); else from += -lead;
      }

    }

    v.play().then(() => {

      box.classList.add('on'); films.on = true; cctv.t0 = 0;

      // voice is now (a little ahead, for the seek), and cut at the same point in the clip whenever it got there
      if (vs?.beat === beat) {

        if (Math.abs(v.currentTime - want) > 0.06) { try { v.currentTime = want; } catch (e) { /* not seekable yet */ } }

function showStep(i, keepCard = false) {

  setCard(STEPS[i].beat, keepCard);

// the card lying on the page over its own drawn box (the start of the enter zoom, a hop's two ends)

// the camera is put where the box sits exactly as the card did, and the page fades up around it
function toPage(beatId) {
  const A = boxPose(beatId);

// CRSSHKKKKK! cuts straight into the next space (Paul: "should play into next scene without

function cutTo(i) {

  sound.stopVoice(); stopFilm(false); setHint('');
  card.visible = false; cardState.target = 0; cardState.lift = 0;
  loadWorld(STEPS[i].world).then(() => arrive(i, 'cut')).catch((e) => { console.warn(e); arrive(i, 'cut'); });

function startJourney() {
  state.stage = 'read'; state.beat = -1;

  $('sr').textContent = `${tapWord} the page to enter.`;
  loadWorld(STEPS[0].world).catch((e) => console.warn('world unavailable', e));

function enterSpace() {
  if (journey.phase !== 'idle') return;
  journey.phase = 'enter'; journey.t = 0;
  state.stage = 'enter';
  state.camStart = camera.position.clone();
  setHint('');
  // the narrator's caption becomes the first card (Paul: "zoom seamlessly into the narrator panel
  // with no cuts, background switches in seamlessly behind"): the card starts on the page over the
  // drawn box, and the camera zooms until the box sits exactly where the card rests, while the page
  // fades to dark around it and the lens eases to the spaces' field of view; then the first space
  // unwinds out of its core behind it
  setCard(STEPS[0].beat, true);
  const P = boxPose(BEATS[STEPS[0].beat].b);
  layCard(P);
  journey.enter = { from: camera.position.clone(), q: camera.quaternion.clone(), fov0: camera.fov, fov1: P.fov, to: P.to };
  // the zoom into the caption: the second airy whoosh, which peaks about as the zoom lands
  if (!sound.sfxPlay('airy-2', { gain: 0.7, verb: 0.12, echo: 0.14 }) && !sound.sfxPlay('whoosh-1', { gain: 0.6, verb: 0.35, echo: 0.22 })) sound.blip();
  if (sound.ok) { sound.cabin.gain.setTargetAtTime(0.25, sound.now(), 0.8); sound.startSpace(); }
}

function journeyNext() {
  if (journey.phase !== 'space') return;
  const i = journey.step, beat = BEATS[STEPS[i].beat];
  if (beat.hold) { nudge(); return; }
  musicCue(beat.b + ':leave');
  if (beat.trigger) { finalBreach(); return; }
  const next = STEPS[i + 1];
  if (next.world === STEPS[i].world) { showStep(i + 1); return; }
  if (beat.cut) { cutTo(i + 1); return; }
  if (reducedMotion) { leave(next.world, () => arrive(i + 1)); return; }
  leave(null, () => startHop(i + 1), OUT_DUR, true);
}

// collapse the current space into its core, then load and unwind the next (or, without a next
// world, go on to then: a hop or the pull back to the page, which load the world themselves).
// keepCard: the card stays up while the space collapses behind it, to be carried onto the page.
function leave(nextWorld, then, dur = OUT_DUR, keepCard = false) {

    b.vel += ((b.target - b.lift) * 95 - b.vel * 12) * dt;

    const rise = Math.max(0, b.lift) * (reducedMotion ? 0.12 : 1.6);

    const cx = state.stage === 'read' ? camera.position.x : 0, cy = state.stage === 'read' ? camera.position.y : 0;
    b.mesh.position.set(b.base.x * keep + cx * (1 - keep), b.base.y * keep + cy * (1 - keep), bubbleZ + rise);

    const n = Math.floor(fx.acc); fx.acc -= n;
    fxEmit(n, state.holdX, state.holdY, 120 + 640 * p);
    if (!reducedMotion && journey.on) worlds.jitter = Math.max(worlds.jitter, 0.4 * p * p);
    if (p >= 1) endHold(true);
  }
  fxUpdate(dt);

  // breach
  if (state.stage === 'breach') {
    if (!state.freeze) state.breachT += rawDt;
    const u = clamp(state.breachT / BREACH_DUR, 0, 1);
    if (!reducedMotion) {
      pageMat.uniforms.uOpacity.value = 1 - smooth(0.0, 0.05, u);
      pageMesh.visible = pageMat.uniforms.uOpacity.value > 0.01;
      ptsMat.uniforms.uT.value = smooth(0.0, 0.5, u) * 1.3;
      bubbles.forEach((b) => (b.mat.uniforms.uOpacity.value = 1 - smooth(0.05, 0.25, u)));
      shared.uAgit.value = 1 - smooth(0.0, 0.3, u);
      const zc = u < 0.42 ? lerp(state.camStart.z, 0.15, ease(u / 0.42)) : lerp(0.15, VOID_Z, ease((u - 0.42) / 0.58));
      camera.position.set(lerp(state.camStart.x, CX, smooth(0, 0.3, u)), lerp(state.camStart.y, CY, smooth(0, 0.3, u)), zc);
      tmpV.set(CX, CY, -100);
      const lt = tmpV.clone().lerp(state.lookStart, 1 - smooth(0, 0.35, u));
      camera.lookAt(lt);
      camera.rotateZ(Math.sin(u * Math.PI) * 0.5);
      camera.fov = lerp(40 + smooth(0.3, 0.65, u) * 34, voidFov(), smooth(0.8, 1, u));
      camera.updateProjectionMatrix();
      const sc = renderer.domElement.height / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)));
      ptsMat.uniforms.uScale.value = sc;
      voidU.uFog.value = lerp(0.6, 0.034, smooth(0.1, 0.75, u));
      worlds.suction = 1 - 0.6 * smooth(0.5, 1, u);
      if (worlds.ok && u > 0.72 && voidGroup.visible) useWorld(true);
      if (u > 0.7 && u < 0.73) flash(0.35);
    }
    if (state.breachT >= BREACH_DUR) enterVoid();
  }

  // void free look
  if (state.stage === 'void') {
    state.endT += rawDt;
    // wall clock, like the other story timers, so a slow device still settles
    const sRate = reducedMotion ? 10 : worlds.suctionRate;
    worlds.suction += clamp(worlds.suctionTarget - worlds.suction, -sRate * rawDt, sRate * rawDt);
    const lim = worlds.ok ? worlds.limits : { yaw: [-Infinity, Infinity], pitch: [-1.3, 1.3] };
    if (!look.dragging) {
      look.vyaw *= Math.exp(-dt * 3); look.vpitch *= Math.exp(-dt * 3);
      look.yaw += look.vyaw; look.pitch += look.vpitch;
      look.idle += dt;
      if (look.idle > 4 && !reducedMotion) {
        // drift slowly; inside a world, sweep back and forth within what Marble made
        if (worlds.ok) look.yaw += Math.sin(state.endT * 0.05) * dt * 0.05;
        else look.yaw += dt * 0.04;
      }
      // ease back inside the limits rather than stopping dead
      look.yaw += (clamp(look.yaw, lim.yaw[0], lim.yaw[1]) - look.yaw) * (1 - Math.exp(-dt * 4));
      look.pitch += (clamp(look.pitch, lim.pitch[0], lim.pitch[1]) - look.pitch) * (1 - Math.exp(-dt * 4));
    }
    look.pitch = clamp(look.pitch, -1.3, 1.3);
    const gy = reducedMotion ? 0 : parallax.gx * 0.6, gp = reducedMotion ? 0 : -parallax.gy * 0.4;
    camera.rotation.set(look.pitch + gp, look.yaw - gy, 0);
    const fwd = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
    if (worlds.ok) {
      // a world only holds together near its viewpoint, so the drift stays within a small radius
      if (!reducedMotion && worlds.relief) worlds.drift.addScaledVector(fwd, dt * 0.02).clampLength(0, WORLD_SCALE * 0.08);
      // a Marble world is a shell around its viewpoint, so a still camera sees a flat panorama;
      // a slow wander through the middle of it is what shows its depth
      if (!worlds.relief && !reducedMotion) {
        const T = worlds.wanderT ?? state.endT, R = (worlds.wanderR ?? worlds.radius) * WORLD_SCALE;
        // forward travel is shorter when extruded, so the camera stays clear of splats pulled towards it
        const ex = worlds.u.extrude.value > 0, side = ex ? 0.09 : 0.16, fwdMax = ex ? 0.12 : 0.24;
        worlds.wander.set(side * Math.sin(T * 0.13), 0.04 * Math.sin(T * 0.09 + 1), -fwdMax * (0.5 - 0.5 * Math.cos(T * 0.07))).multiplyScalar(R);
      } else worlds.wander.set(0, 0, 0);
      // the pointer (or tilt) slides the viewpoint a little more
      const px = reducedMotion ? 0 : clamp(parallax.tx + parallax.gx, -1.2, 1.2), py = reducedMotion ? 0 : clamp(parallax.ty + parallax.gy, -1.2, 1.2);
      worlds.offset.lerp(tmpV.set(px, -py, 0).multiplyScalar(worlds.parallax).applyQuaternion(camera.quaternion), 1 - Math.exp(-dt * 4));
      camera.position.copy(P0).add(worlds.drift).add(worlds.wander).add(worlds.offset);
      // the singularity draws back (Paul, 24 October: "a slow zoom out until it appears like a nebula
      // filling half the screen", then "faster"): from a few seconds after it has opened the camera eases
      // straight back over about 18 s, to where the world's shell spans half the screen's height, and stays
      if (worlds.id === STORY_WORLD && !REVIEW && (!journey.on || journey.done) && !reducedMotion && params.get('zoomout') !== '0') {
        const R = worlds.radius * WORLD_SCALE, D = R / Math.tan(THREE.MathUtils.degToRad(camera.fov / 4));
        camera.position.z += D * smooth(3, 21, state.endT);
      }
      // camera moves through two of the spaces (Paul): a slow lateral truck across Bob's floating panel,
      // so the panel and its layers drift against the world behind, and a slow diagonal drift through the
      // ribbons, which sway after it. Each starts from the viewpoint, so arrivals stay seamless.
      if (journey.on && !journey.done && !reducedMotion) {
        const T = state.endT;
        if (worlds.id === PANEL_WORLD) camera.position.x += 1.8 * Math.sin(T * 0.09);
        if (worlds.id === RIBBON_WORLD) { const k = Math.sin(T * 0.08); camera.position.x += 1.6 * k; camera.position.y += 1.0 * k; }
      }
    } else if (!reducedMotion) camera.position.addScaledVector(fwd, dt * 0.25);
    // To be continued... comes 8 s into the ending (Paul: five seconds later than it was)
    if (state.endT > 8 && !tbcCard.visible && !REVIEW && (!journey.on || journey.done)) {
      tbcCard.visible = true;
      sound.playVoice(END_BEAT);
      musicBeat(END_BEAT);
      const gp = tbc.mesh.geometry.parameters, visW = 2 * 2.4 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * camera.aspect;
      const s = Math.min(0.34 / gp.height, (visW * 0.78) / gp.width);
      tbcCard.scale.setScalar(s);
      tbcCard.position.set(0, -0.62, -2.4);
    }
    updateEndNav(rawDt);
    if (tbcCard.visible) {
      tbcCard.material.uniforms.uOpacity.value = smooth(3, 4.5, state.endT);
      tbcCard.material.uniforms.uFlick.value = state.endT < 3.6 ? 1 : 0;
    }
    if (state.endT > 6 && look.idle < 1 && (!journey.on || journey.done)) setHint('');
  }

  spinners.forEach((s) => { s.o.rotation.y += s.s * dt; s.o.rotation.x += s.s * 0.5 * dt; });
  sing.material.rotation += dt * 0.03;
  sing.scale.setScalar(46 + Math.sin(t * 0.7) * 2);
  updateJourney(rawDt, dt);
  updateWorld(rawDt, t);
  updateShards(dt);
  updateNucleus(dt);
  updateSlab(dt, rawDt);
  updateStrobe(rawDt);
  sound.bedTo(state.stage === 'read' || (state.stage === 'void' && worlds.id === STORY_WORLD && (!journey.on || journey.done) && !REVIEW) ? 0.55 : 0);
  updatePanelFloat(dt);
  updateBackdrop(rawDt);
  updateGlyphField(rawDt);
  if (films.on) { drawSuper8(rawDt); drawCCTV(rawDt); } else if (s8.el.classList.contains('on')) s8.el.classList.remove('on');
  if (pad.on) drawPad(rawDt);
  updateRibbons(dt, rawDt);
  updateHelix(dt);
  updateProps(dt);
  updateParticles(dt);
  if (sound.ok && music.index) musicLoop(state.stage === 'void' && worlds.ok ? worlds.id : state.stage === 'read' ? 'page' : music.loopKey);
  sound.update(dt, camera);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

Promise.all([loadTex(PAGE_SRC, true), loadTex(DEPTH_SRC, false)]).then(([page, depth]) => {
  depth.generateMipmaps = false; depth.minFilter = THREE.LinearFilter; depth.anisotropy = 1;
  shared.uPage.value = page; shared.uDepth.value = depth;
  resize();
  // the OT logo holds for at least 1.8 s from the page opening, then cuts away to the start
  setTimeout(() => { $('intro').classList.add('out'); decryptCode(); }, Math.max(0, 1800 - (performance.now() - (window.__introT0 || 0))));
  window.__ot = { glyphVeilShow, startHop, updateHop, state, breach, showBeat, BEATS, camera, worlds, look, parallax, journey, STEPS, journeyNext, finalBreach, enterSpace, showStep, sound, films, playFilm, stopFilm, shards, nucleus, ribbons, helix, props, particles, slab, panelFloat, backdrop, card, music, musicBeat, pad, strobe, strobeBurst, endReady, s8, panelGrains, glyphField, shared };
  requestAnimationFrame(frame);
}).catch((e) => { $('gate').classList.add('ready'); $('note').innerHTML = '<span class="err">The page artwork failed to load.</span>'; console.error(e); });
</script>
</body>
